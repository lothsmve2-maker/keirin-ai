<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>競輪AI予想</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f3f5f8;
  color: #17202a;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    Meiryo,
    sans-serif;
}

header {
  background: linear-gradient(135deg,#111827,#1f2937);
  color: #fff;
  padding: 20px 14px;
  position: sticky;
  top: 0;
  z-index: 50;
  box-shadow: 0 3px 12px rgba(0,0,0,.18);
}

.header-inner {
  max-width: 950px;
  margin: auto;
}

.title {
  font-size: 24px;
  font-weight: 900;
}

.subtitle {
  margin-top: 4px;
  font-size: 12px;
  opacity: .75;
}

.container {
  max-width: 950px;
  margin: auto;
  padding: 13px 10px 60px;
}

.section-title {
  font-size: 18px;
  font-weight: 900;
  margin: 12px 2px 9px;
}

/* =========================
   開催場
========================= */

.venue-grid {
  display: grid;
  grid-template-columns: repeat(2,1fr);
  gap: 8px;
}

.venue-card {
  background: #fff;
  border-radius: 14px;
  padding: 13px;
  border: 2px solid transparent;
  box-shadow: 0 2px 8px rgba(0,0,0,.07);
  cursor: pointer;
}

.venue-card.active {
  border-color: #2563eb;
  background: #eff6ff;
}

.venue-name {
  font-size: 17px;
  font-weight: 900;
}

.venue-count {
  margin-top: 4px;
  color: #6b7280;
  font-size: 11px;
}

/* =========================
   レース
========================= */

.race-list {
  display: grid;
  grid-template-columns: repeat(4,1fr);
  gap: 7px;
}

.race-btn {
  border: 0;
  background: #fff;
  border-radius: 11px;
  padding: 10px 4px;
  font-weight: 900;
  box-shadow: 0 2px 7px rgba(0,0,0,.07);
}

.race-btn.active {
  background: #2563eb;
  color: #fff;
}

.race-number {
  font-size: 17px;
}

.race-info {
  display: block;
  font-size: 10px;
  margin-top: 2px;
  opacity: .7;
}

/* =========================
   レース
========================= */

.race-header {
  background: #fff;
  border-radius: 16px;
  padding: 15px;
  margin-top: 14px;
  box-shadow: 0 2px 9px rgba(0,0,0,.08);
}

.race-title {
  font-size: 23px;
  font-weight: 900;
}

.race-meta {
  margin-top: 4px;
  color: #6b7280;
  font-size: 12px;
}

/* =========================
   勝負判定
========================= */

.verdict-card {
  margin-top: 11px;
  border-radius: 16px;
  padding: 15px;
  color: #fff;
  box-shadow: 0 4px 12px rgba(0,0,0,.12);
}

.verdict-s {
  background: linear-gradient(135deg,#991b1b,#dc2626);
}

.verdict-a {
  background: linear-gradient(135deg,#c2410c,#f97316);
}

.verdict-b {
  background: linear-gradient(135deg,#1d4ed8,#2563eb);
}

.verdict-c {
  background: linear-gradient(135deg,#4b5563,#6b7280);
}

.verdict-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.verdict-title {
  font-size: 18px;
  font-weight: 900;
}

.verdict-grade {
  font-size: 30px;
  font-weight: 1000;
}

.verdict-action {
  display: inline-block;
  margin-top: 7px;
  background: rgba(255,255,255,.18);
  border-radius: 999px;
  padding: 5px 11px;
  font-size: 12px;
  font-weight: 900;
}

.verdict-reason {
  margin-top: 9px;
  font-size: 12px;
  line-height: 1.65;
  opacity: .96;
}

/* =========================
   AI本命
========================= */

.ai-grid {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 8px;
  margin-top: 11px;
}

.ai-card {
  background: #fff;
  border-radius: 15px;
  padding: 12px 6px;
  text-align: center;
  box-shadow: 0 2px 8px rgba(0,0,0,.08);
}

.ai-label {
  font-size: 11px;
  font-weight: 900;
}

.ai-car {
  font-size: 27px;
  font-weight: 900;
  margin-top: 5px;
}

.ai-name {
  margin-top: 4px;
  font-size: 12px;
  font-weight: 900;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.ai-score {
  margin-top: 4px;
  font-size: 11px;
  color: #6b7280;
}

.main-card {
  border-top: 5px solid #dc2626;
}

.opponent-card {
  border-top: 5px solid #2563eb;
}

.dark-card {
  border-top: 5px solid #f97316;
}

/* =========================
   共通カード
========================= */

.info-card {
  background: #fff;
  border-radius: 16px;
  margin-top: 12px;
  padding: 14px;
  box-shadow: 0 2px 8px rgba(0,0,0,.07);
}

.info-title {
  font-size: 16px;
  font-weight: 900;
  margin-bottom: 10px;
}

/* =========================
   車番色
========================= */

.car-1 {
  background:#fff;
  color:#111827;
  border:1px solid #aeb4bc;
}

.car-2 {
  background:#111827;
  color:#fff;
}

.car-3 {
  background:#dc2626;
  color:#fff;
}

.car-4 {
  background:#2563eb;
  color:#fff;
}

.car-5 {
  background:#facc15;
  color:#111827;
}

.car-6 {
  background:#16a34a;
  color:#fff;
}

/* 7番は必ずオレンジ */

.car-7 {
  background:#f97316;
  color:#fff;
}

/* =========================
   AI選手名カラー
========================= */

.c1 { color:#374151; }
.c2 { color:#111827; }
.c3 { color:#dc2626; }
.c4 { color:#2563eb; }
.c5 { color:#b77900; }
.c6 { color:#15803d; }
.c7 { color:#ea580c; }

/* =========================
   買い目
========================= */

.bet-summary {
  background: linear-gradient(135deg,#fff7ed,#fff);
  border: 2px solid #fed7aa;
}

.bet-header {
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.bet-title {
  font-size:18px;
  font-weight:900;
}

.bet-badge {
  background:#f97316;
  color:#fff;
  padding:5px 10px;
  border-radius:999px;
  font-size:11px;
  font-weight:900;
}

.bet-explanation {
  margin-top:7px;
  color:#4b5563;
  font-size:12px;
  line-height:1.6;
}

.bet-list {
  margin-top:11px;
  display:grid;
  gap:7px;
}

.bet-item {
  display:grid;
  grid-template-columns:29px 1fr auto;
  align-items:center;
  gap:8px;
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:11px;
  padding:9px;
}

.bet-item.main {
  border:2px solid #ef4444;
  background:#fff7f7;
}

.bet-rank {
  width:27px;
  height:27px;
  border-radius:50%;
  background:#f3f4f6;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:11px;
  font-weight:900;
}

.bet-item.main .bet-rank {
  background:#dc2626;
  color:#fff;
}

.bet-numbers {
  font-size:18px;
  font-weight:900;
  letter-spacing:1px;
}

.bet-type {
  margin-top:2px;
  font-size:10px;
  color:#6b7280;
}

.bet-score {
  font-size:11px;
  font-weight:900;
  color:#f97316;
}

/* =========================
   展開
========================= */

.development {
  background:#fff7ed;
  border-left:4px solid #f97316;
  border-radius:8px;
  padding:11px;
  font-size:13px;
  line-height:1.65;
}

/* =========================
   並び
========================= */

.line-display {
  display:flex;
  flex-wrap:wrap;
  gap:7px;
}

.line-group {
  display:flex;
  align-items:center;
  gap:4px;
  padding:7px 8px;
  background:#f3f4f6;
  border-radius:10px;
}

.line-car {
  width:31px;
  height:31px;
  border-radius:7px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:14px;
  font-weight:900;
}

.arrow {
  color:#6b7280;
  font-weight:900;
}

/* =========================
   AIランキング
========================= */

.ai-ranking {
  display:grid;
  gap:5px;
}

.ai-ranking-row {
  display:grid;
  grid-template-columns:26px 31px 1fr 52px 29px;
  align-items:center;
  gap:6px;
  padding:7px 2px;
  border-bottom:1px solid #edf0f3;
}

.ai-rank-number {
  font-weight:900;
  color:#6b7280;
}

.ai-ranking-car {
  width:29px;
  height:29px;
  border-radius:6px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:13px;
  font-weight:900;
}

.ai-ranking-name {
  font-size:13px;
  font-weight:900;
}

.ai-ranking-score {
  text-align:right;
  font-size:13px;
  font-weight:900;
}

.ai-grade {
  width:27px;
  height:27px;
  border-radius:6px;
  background:#f3f4f6;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:11px;
  font-weight:900;
}

/* =========================
   選手
========================= */

.rider {
  border:1px solid #e5e7eb;
  border-radius:13px;
  margin-top:9px;
  padding:11px;
}

.rider-top {
  display:flex;
  align-items:center;
  gap:9px;
}

.rider-car {
  width:37px;
  height:37px;
  flex:0 0 37px;
  border-radius:8px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:17px;
  font-weight:900;
}

.rider-name {
  flex:1;
  font-size:15px;
  font-weight:900;
}

.rider-mark {
  min-width:30px;
  height:30px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
  background:#f3f4f6;
}

.rider-meta {
  margin-top:5px;
  font-size:11px;
  color:#6b7280;
}

.score-box {
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-top:8px;
}

.score {
  background:#f1f5f9;
  border-radius:7px;
  padding:5px 8px;
  font-size:11px;
  font-weight:700;
}

.rider-comment {
  margin-top:8px;
  background:#f8fafc;
  border-radius:8px;
  padding:8px;
  font-size:13px;
  line-height:1.55;
}

/* =========================
   読み込み
========================= */

.loading {
  text-align:center;
  padding:50px 10px;
  color:#6b7280;
}

.error {
  margin-top:15px;
  padding:15px;
  border-radius:12px;
  background:#fee2e2;
  color:#991b1b;
}

.status {
  margin-top:13px;
  text-align:center;
  color:#6b7280;
  font-size:11px;
}

/* =========================
   スマホ
========================= */

@media(max-width:430px) {

  .title {
    font-size:22px;
  }

  .ai-car {
    font-size:25px;
  }

  .ai-name {
    font-size:11px;
  }

  .bet-numbers {
    font-size:17px;
  }

  .ai-ranking-row {
    grid-template-columns:24px 30px 1fr 48px 28px;
  }

}

@media(min-width:700px) {

  .venue-grid {
    grid-template-columns:repeat(4,1fr);
  }

  .race-list {
    grid-template-columns:repeat(6,1fr);
  }

}

</style>
</head>

<body>

<header>
  <div class="header-inner">

    <div class="title">
      🏇 競輪AI予想
    </div>

    <div class="subtitle">
      AI評価・展開・ラインから勝負レースを分析
    </div>

  </div>
</header>

<main class="container">

  <div id="loading" class="loading">
    データを読み込んでいます…
  </div>

  <div id="app" style="display:none;">

    <div class="section-title">
      🏟 開催場
    </div>

    <div id="venues" class="venue-grid"></div>

    <div class="section-title" style="margin-top:18px;">
      🏁 レース
    </div>

    <div id="races" class="race-list"></div>

    <div id="racePanel"></div>

    <div id="status" class="status"></div>

  </div>

  <div id="error" style="display:none;"></div>

</main>

<script>

let DATA = null;
let selectedVenue = null;
let selectedRace = null;

const DATA_URL = "./data/today.json";

/* =====================================================
   データ
===================================================== */

async function loadData() {

  try {

    const response =
      await fetch(
        DATA_URL + "?t=" + Date.now()
      );

    if (!response.ok) {
      throw new Error(
        "today.jsonを取得できませんでした"
      );
    }

    DATA = await response.json();

    if (!DATA.races?.length) {
      throw new Error(
        "レースデータがありません"
      );
    }

    document.getElementById("loading")
      .style.display = "none";

    document.getElementById("app")
      .style.display = "block";

    renderVenues();

    const first =
      DATA.venues?.[0]?.venue_code ||
      DATA.races[0].venue_code;

    selectVenue(first);

    document.getElementById("status")
      .textContent =
      `${DATA.target_date || ""} / ` +
      `${DATA.race_count || DATA.races.length}レース / ` +
      `${DATA.rider_count || 0}選手`;

  } catch(error) {

    document.getElementById("loading")
      .style.display = "none";

    const box =
      document.getElementById("error");

    box.style.display = "block";

    box.innerHTML =
      "⚠️ データ読み込み失敗<br><br>" +
      escapeHtml(error.message);

  }

}

/* =====================================================
   開催場
===================================================== */

function renderVenues() {

  const box =
    document.getElementById("venues");

  box.innerHTML = "";

  DATA.venues.forEach(v => {

    const div =
      document.createElement("div");

    div.className =
      "venue-card";

    div.dataset.code =
      v.venue_code;

    div.innerHTML = `
      <div class="venue-name">
        ${escapeHtml(v.venue_name)}
      </div>

      <div class="venue-count">
        ${v.race_count}レース
      </div>
    `;

    div.onclick =
      () => selectVenue(v.venue_code);

    box.appendChild(div);

  });

}

function selectVenue(code) {

  selectedVenue =
    String(code);

  document
    .querySelectorAll(".venue-card")
    .forEach(card => {

      card.classList.toggle(
        "active",
        String(card.dataset.code) ===
        selectedVenue
      );

    });

  const races =
    DATA.races
      .filter(
        r =>
          String(r.venue_code) ===
          selectedVenue
      )
      .sort(
        (a,b) =>
          a.race_no - b.race_no
      );

  renderRaceButtons(races);

  if (races.length) {
    selectRace(races[0]);
  }

}

/* =====================================================
   レース
===================================================== */

function renderRaceButtons(races) {

  const box =
    document.getElementById("races");

  box.innerHTML = "";

  races.forEach(race => {

    const btn =
      document.createElement("button");

    btn.className =
      "race-btn";

    btn.dataset.race =
      `${race.venue_code}-${race.race_no}`;

    btn.innerHTML = `
      <span class="race-number">
        ${race.race_no}R
      </span>

      <span class="race-info">
        ${race.riders.length}車
      </span>
    `;

    btn.onclick =
      () => selectRace(race);

    box.appendChild(btn);

  });

}

function selectRace(race) {

  selectedRace = race;

  document
    .querySelectorAll(".race-btn")
    .forEach(btn => {

      btn.classList.toggle(
        "active",
        btn.dataset.race ===
        `${race.venue_code}-${race.race_no}`
      );

    });

  renderRace(race);

}

/* =====================================================
   レース全体
===================================================== */

function renderRace(race) {

  const panel =
    document.getElementById("racePanel");

  const ai =
    race.ai || {};

  const main =
    findRider(race, ai.main);

  const opponent =
    findRider(race, ai.opponent);

  const dark =
    findRider(race, ai.dark_horse);

  const verdict =
    calculateVerdict(
      race,
      main,
      opponent,
      dark
    );

  panel.innerHTML = `

    <div class="race-header">

      <div class="race-title">
        ${escapeHtml(race.venue_name)}
        ${race.race_no}R
      </div>

      <div class="race-meta">
        ${race.riders.length}車立て /
        AIデータ取得済み
      </div>

    </div>

    ${renderVerdict(verdict)}

    <div class="ai-grid">

      ${renderAICard(
        "🔥 本命",
        main,
        "main-card"
      )}

      ${renderAICard(
        "⭐ 対抗",
        opponent,
        "opponent-card"
      )}

      ${renderAICard(
        "💥 穴",
        dark,
        "dark-card"
      )}

    </div>

    ${renderBets(
      race,
      verdict
    )}

    ${renderLine(race)}

    ${renderDevelopment(race)}

    ${renderRanking(race)}

    ${renderRiders(race)}

  `;

}

/* =====================================================
   勝負度
===================================================== */

function calculateVerdict(
  race,
  main,
  opponent,
  dark
) {

  const riders =
    [...race.riders]
      .sort(
        (a,b) =>
          (b.ai_score || 0) -
          (a.ai_score || 0)
      );

  if (!riders.length) {

    return {
      grade:"C",
      action:"見送り",
      score:0,
      reason:"AI評価データ不足"
    };

  }

  const first =
    riders[0]?.ai_score || 0;

  const second =
    riders[1]?.ai_score || 0;

  const third =
    riders[2]?.ai_score || 0;

  const spread =
    first - second;

  let score = 50;

  /*
   * 本命の優位性
   */

  score +=
    Math.min(
      20,
      spread * 2
    );

  /*
   * 2番手と3番手の差
   */

  if (
    second - third >= 5
  ) {
    score += 8;
  }

  /*
   * ラインがある場合
   */

  if (
    race.line &&
    race.line.length ===
    race.riders.length
  ) {
    score += 8;
  }

  /*
   * 展開コメントあり
   */

  if (race.development) {
    score += 5;
  }

  /*
   * 予想情報あり
   */

  if (
    race.prediction_url
  ) {
    score += 4;
  }

  score =
    Math.max(
      0,
      Math.min(
        100,
        score
      )
    );

  let grade;
  let action;

  if (score >= 82) {

    grade = "S";
    action = "🔥 勝負";

  } else if (score >= 72) {

    grade = "A";
    action = "🎯 買い";

  } else if (score >= 61) {

    grade = "B";
    action = "⭐ 少額";

  } else {

    grade = "C";
    action = "⚠️ 見送り";

  }

  const reasons = [];

  if (spread >= 8) {

    reasons.push(
      `本命${main?.car_no || ""}番のAI評価が上位に明確に抜けています`
    );

  } else if (spread >= 4) {

    reasons.push(
      `本命${main?.car_no || ""}番が対抗より優勢です`
    );

  } else {

    reasons.push(
      "上位勢のAI評価が接近しており混戦です"
    );

  }

  if (
    race.line_groups &&
    race.line_groups.length
  ) {

    reasons.push(
      "予想ラインを考慮して展開別の買い目を生成しています"
    );

  }

  if (dark) {

    reasons.push(
      `穴は${dark.car_no}番。展開次第で上位進出を警戒`
    );

  }

  return {
    grade,
    action,
    score: Math.round(score),
    reason: reasons.join("。") + "。"
  };

}

/* =====================================================
   勝負度表示
===================================================== */

function renderVerdict(v) {

  const cls =
    v.grade === "S"
      ? "verdict-s"
      : v.grade === "A"
      ? "verdict-a"
      : v.grade === "B"
      ? "verdict-b"
      : "verdict-c";

  return `

    <div class="verdict-card ${cls}">

      <div class="verdict-top">

        <div>

          <div class="verdict-title">
            AI勝負度
          </div>

          <div class="verdict-action">
            ${v.action}
          </div>

        </div>

        <div class="verdict-grade">
          ${v.grade}
        </div>

      </div>

      <div class="verdict-reason">
        ${escapeHtml(v.reason)}
      </div>

    </div>

  `;

}

/* =====================================================
   AIカード
===================================================== */

function renderAICard(
  label,
  rider,
  cls
) {

  if (!rider) {

    return `
      <div class="ai-card ${cls}">
        <div class="ai-label">
          ${label}
        </div>
        <div class="ai-car">
          -
        </div>
        <div class="ai-name">
          ---
        </div>
      </div>
    `;

  }

  return `

    <div class="ai-card ${cls}">

      <div class="ai-label">
        ${label}
      </div>

      <div class="
        ai-car c${rider.car_no}">
        ${rider.car_no}番
      </div>

      <div class="
        ai-name c${rider.car_no}">
        ${escapeHtml(rider.name)}
      </div>

      <div class="ai-score">
        AI ${formatScore(
          rider.ai_score
        )}点
      </div>

    </div>

  `;

}

/* =====================================================
   買い目生成
===================================================== */

function generateBets(race) {

  const riders =
    [...race.riders]
      .sort(
        (a,b) =>
          (b.ai_score || 0) -
          (a.ai_score || 0)
      );

  if (riders.length < 3) {
    return [];
  }

  const main =
    riders[0];

  const second =
    riders[1];

  const third =
    riders[2];

  const fourth =
    riders[3];

  const fifth =
    riders[4];

  const dark =
    findRider(
      race,
      race.ai?.dark_horse
    ) || third;

  const candidates = [];

  function add(
    a,
    b,
    c,
    type,
    score
  ) {

    if (!a || !b || !c) {
      return;
    }

    const nums = [
      Number(a.car_no),
      Number(b.car_no),
      Number(c.car_no)
    ];

    if (
      new Set(nums).size !== 3
    ) {
      return;
    }

    const key =
      nums.join("-");

    if (
      candidates.some(
        x => x.key === key
      )
    ) {
      return;
    }

    candidates.push({
      key,
      nums,
      type,
      score
    });

  }

  /*
   * AI本線
   */

  add(
    main,
    second,
    third,
    "🔥 AI本線",
    100
  );

  add(
    main,
    third,
    second,
    "🔥 本線入替",
    97
  );

  add(
    second,
    main,
    third,
    "⭐ 対抗頭",
    94
  );

  add(
    main,
    second,
    dark,
    "🎯 穴絡み",
    92
  );

  add(
    main,
    dark,
    second,
    "🎯 穴入替",
    90
  );

  /*
   * ライン展開
   */

  const groups =
    race.line_groups || [];

  groups.forEach(group => {

    if (group.length < 2) {
      return;
    }

    const a =
      findRider(
        race,
        group[0]
      );

    const b =
      findRider(
        race,
        group[1]
      );

    if (!a || !b) {
      return;
    }

    add(
      a,
      b,
      main,
      "🚴 ライン本線",
      88
    );

    add(
      b,
      a,
      main,
      "🔄 番手差し",
      85
    );

    add(
      a,
      main,
      b,
      "⚡ 先頭残り",
      82
    );

  });

  /*
   * 逆転
   */

  add(
    third,
    main,
    second,
    "💥 逆転",
    82
  );

  add(
    second,
    third,
    main,
    "💥 対抗展開",
    80
  );

  /*
   * 中穴
   */

  if (fourth) {

    add(
      main,
      fourth,
      second,
      "🎯 中穴",
      76
    );

    add(
      fourth,
      main,
      third,
      "💥 高配当",
      72
    );

  }

  /*
   * 大穴
   */

  if (fifth) {

    add(
      main,
      dark,
      fifth,
      "💣 大穴警戒",
      68
    );

    add(
      dark,
      main,
      second,
      "💣 穴頭",
      65
    );

  }

  /*
   * ライン内の選手を評価
   */

  const line =
    race.line || [];

  candidates.forEach(
    bet => {

      const count =
        bet.nums.filter(
          n => line.includes(n)
        ).length;

      bet.score +=
        count * 2;

    }
  );

  candidates.sort(
    (a,b) =>
      b.score - a.score
  );

  return candidates.slice(
    0,
    10
  );

}

/* =====================================================
   買い目表示
===================================================== */

function renderBets(
  race,
  verdict
) {

  const bets =
    generateBets(race);

  if (!bets.length) {
    return "";
  }

  let explanation;

  if (verdict.grade === "S") {

    explanation =
      "本命の優位性が高いため、本線を厚めに。後半は展開違い・穴絡みを押さえています。";

  } else if (verdict.grade === "A") {

    explanation =
      "本線を中心に、ラインの入れ替わりと穴選手の浮上までカバーしています。";

  } else if (verdict.grade === "B") {

    explanation =
      "混戦傾向です。本線を絞りすぎず、展開が変わった場合の買い目も押さえています。";

  } else {

    explanation =
      "AI評価が接近しているため、無理な勝負はおすすめしません。買う場合は少額で。";

  }

  return `

    <div class="info-card bet-summary">

      <div class="bet-header">

        <div class="bet-title">
          🎯 AI推奨買い目
        </div>

        <div class="bet-badge">
          ${bets.length}点
        </div>

      </div>

      <div class="bet-explanation">
        ${explanation}
      </div>

      <div class="bet-list">

        ${bets.map(
          (bet,index) => `

          <div class="
            bet-item
            ${index === 0 ? "main" : ""}
          ">

            <div class="bet-rank">
              ${index + 1}
            </div>

            <div>

              <div class="bet-numbers">
                ${bet.nums.join(" - ")}
              </div>

              <div class="bet-type">
                ${escapeHtml(
                  bet.type
                )}
              </div>

            </div>

            <div class="bet-score">
              ${bet.score}
            </div>

          </div>

        `
        ).join("")}

      </div>

    </div>

  `;

}

/* =====================================================
   並び
===================================================== */

function renderLine(race) {

  const groups =
    race.line_groups || [];

  let html = "";

  if (groups.length) {

    html =
      groups.map(
        group => `

        <div class="line-group">

          ${group.map(
            (car,index) => `

            ${
              index > 0
              ? `<span class="arrow">→</span>`
              : ""
            }

            <div class="
              line-car car-${car}">
              ${car}
            </div>

          `
          ).join("")}

        </div>

      `
      ).join("");

  } else if (
    race.line?.length
  ) {

    html = `

      <div class="line-group">

        ${race.line.map(
          (car,index) => `

          ${
            index > 0
            ? `<span class="arrow">→</span>`
            : ""
          }

          <div class="
            line-car car-${car}">
            ${car}
          </div>

        `
        ).join("")}

      </div>

    `;

  } else {

    html =
      "並び情報なし";

  }

  return `

    <div class="info-card">

      <div class="info-title">
        🚴 予想ライン
      </div>

      <div class="line-display">
        ${html}
      </div>

    </div>

  `;

}

/* =====================================================
   展開
===================================================== */

function renderDevelopment(race) {

  if (!race.development) {
    return "";
  }

  return `

    <div class="info-card">

      <div class="info-title">
        🧠 AI展開予想
      </div>

      <div class="development">
        ${escapeHtml(
          race.development
        )}
      </div>

    </div>

  `;

}

/* =====================================================
   AIランキング
===================================================== */

function renderRanking(race) {

  const ranking =
    [...(
      race.ai?.ranking || []
    )];

  if (!ranking.length) {
    return "";
  }

  return `

    <div class="info-card">

      <div class="info-title">
        📊 AI評価ランキング
      </div>

      <div class="ai-ranking">

        ${ranking.map(
          (r,index) => {

            const grade =
              index === 0
              ? "S"
              : index === 1
              ? "A"
              : index === 2
              ? "B"
              : "C";

            return `

              <div class="
                ai-ranking-row">

                <div class="
                  ai-rank-number">
                  ${index + 1}
                </div>

                <div class="
                  ai-ranking-car
                  car-${r.car_no}">
                  ${r.car_no}
                </div>

                <div class="
                  ai-ranking-name
                  c${r.car_no}">
                  ${escapeHtml(
                    r.name
                  )}
                </div>

                <div class="
                  ai-ranking-score
                  c${r.car_no}">
                  ${formatScore(
                    r.score
                  )}
                </div>

                <div class="
                  ai-grade">
                  ${grade}
                </div>

              </div>

            `;

          }
        ).join("")}

      </div>

    </div>

  `;

}

/* =====================================================
   選手
===================================================== */

function renderRiders(race) {

  const riders =
    [...race.riders]
      .sort(
        (a,b) =>
          (b.ai_score || 0) -
          (a.ai_score || 0)
      );

  return `

    <div class="info-card">

      <div class="info-title">
        👤 AI選手評価
      </div>

      ${riders.map(
        (r,index) =>
          renderRider(
            r,
            index
          )
      ).join("")}

    </div>

  `;

}

function renderRider(
  rider,
  index
) {

  let mark =
    rider.prediction_mark;

  if (!mark) {

    if (index === 0) {
      mark = "◎";
    } else if (index === 1) {
      mark = "○";
    } else if (index === 2) {
      mark = "▲";
    } else {
      mark = "△";
    }

  }

  const finish =
    [
      rider.finish_1,
      rider.finish_2,
      rider.finish_3,
      rider.finish_out
    ]
    .filter(
      v =>
        v !== null &&
        v !== undefined
    )
    .join("-");

  return `

    <div class="rider">

      <div class="rider-top">

        <div class="
          rider-car
          car-${rider.car_no}">
          ${rider.car_no}
        </div>

        <div class="
          rider-name
          c${rider.car_no}">
          ${escapeHtml(
            rider.name
          )}
        </div>

        <div class="rider-mark">
          ${escapeHtml(mark)}
        </div>

      </div>

      <div class="rider-meta">

        ${
          rider.age
          ? rider.age + "歳"
          : ""
        }

        ${
          rider.period
          ? " / " +
            rider.period +
            "期"
          : ""
        }

        ${
          rider.prefecture
          ? " / " +
            escapeHtml(
              rider.prefecture
            )
          : ""
        }

        ${
          rider.grade
          ? " / " +
            escapeHtml(
              rider.grade
            )
          : ""
        }

        ${
          rider.style
          ? " / " +
            escapeHtml(
              rider.style
            )
          : ""
        }

      </div>

      <div class="score-box">

        <span class="score">

          AI

          <strong class="
            c${rider.car_no}">
            ${formatScore(
              rider.ai_score
            )}
          </strong>

        </span>

        ${
          rider.score != null
          ? `
            <span class="score">
              競走得点
              ${rider.score}
            </span>
          `
          : ""
        }

        ${
          finish
          ? `
            <span class="score">
              着順 ${finish}
            </span>
          `
          : ""
        }

      </div>

      ${
        rider.comment
        ? `
          <div class="rider-comment">
            💬
            ${escapeHtml(
              rider.comment
            )}
          </div>
        `
        : ""
      }

    </div>

  `;

}

/* =====================================================
   共通
===================================================== */

function findRider(
  race,
  carNo
) {

  if (
    carNo === null ||
    carNo === undefined
  ) {
    return null;
  }

  return race.riders.find(
    r =>
      Number(r.car_no) ===
      Number(carNo)
  ) || null;

}

function formatScore(value) {

  if (
    value === null ||
    value === undefined ||
    isNaN(value)
  ) {
    return "-";
  }

  return Number(value).toFixed(1);

}

function escapeHtml(value) {

  if (
    value === null ||
    value === undefined
  ) {
    return "";
  }

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

loadData();
