<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>競輪AI予想</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
margin:0;
background:#f3f5f8;
color:#17202a;
font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
padding-bottom:90px
}
button{font:inherit;cursor:pointer}
.header{
position:sticky;
top:0;
z-index:50;
background:linear-gradient(135deg,#111827,#1f2937);
color:#fff;
box-shadow:0 3px 12px rgba(0,0,0,.18)
}
.header-inner{
max-width:980px;
margin:auto;
padding:14px 12px;
display:flex;
justify-content:space-between;
align-items:center
}
.title{font-size:21px;font-weight:1000}
.date{font-size:11px;opacity:.7;margin-top:3px}
.header-status{font-size:11px;opacity:.75}
main{max-width:980px;margin:auto;padding:10px}
.page{display:none}
.page.active{display:block}
.card{
background:#fff;
border-radius:16px;
padding:13px;
margin-bottom:10px;
box-shadow:0 2px 8px rgba(0,0,0,.07)
}
.card-title{font-size:16px;font-weight:1000;margin-bottom:9px}
.small{font-size:11px;color:#64748b;line-height:1.6}
.venue-scroll{
display:flex;
gap:7px;
overflow-x:auto;
padding-bottom:2px;
-webkit-overflow-scrolling:touch
}
.venue-btn{
border:1px solid #e2e8f0;
background:#fff;
border-radius:999px;
padding:8px 13px;
font-weight:900;
white-space:nowrap;
flex:0 0 auto
}
.venue-btn.active{
background:#2563eb;
color:#fff;
border-color:#2563eb
}
.race-grid{
display:grid;
grid-template-columns:repeat(8,1fr);
gap:6px
}
.race-btn{
border:0;
background:#f8fafc;
border-radius:10px;
padding:9px 3px;
font-weight:1000;
color:#334155
}
.race-btn.active{background:#2563eb;color:#fff}
.race-btn.settled{box-shadow:inset 0 -3px #16a34a}
.race-btn.confirmed{box-shadow:inset 0 -3px #2563eb}
.race-btn.result{box-shadow:inset 0 -3px #f59e0b}
.race-btn.error{box-shadow:inset 0 -3px #ef4444}
.race-head{
display:flex;
justify-content:space-between;
align-items:flex-start;
gap:8px
}
.race-name{font-size:21px;font-weight:1000}
.race-meta{font-size:11px;color:#64748b;margin-top:4px}
.grade{
padding:7px 10px;
border-radius:9px;
font-weight:1000;
white-space:nowrap
}
.grade-S{background:#fee2e2;color:#991b1b}
.grade-A{background:#ffedd5;color:#9a3412}
.grade-B{background:#dbeafe;color:#1d4ed8}
.grade-C{background:#e5e7eb;color:#4b5563}
.key-box{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:7px;
margin-top:10px
}
.key-item{text-align:center;background:#f8fafc;border-radius:12px;padding:9px}
.key-label{font-size:10px;color:#64748b;font-weight:900}
.key-num{font-size:25px;font-weight:1000;margin-top:2px}
.main-num{color:#dc2626}
.opp-num{color:#2563eb}
.dark-num{color:#ea580c}

.verdict.S{background:linear-gradient(135deg,#991b1b,#dc2626)}

.verdict.B{background:linear-gradient(135deg,#1d4ed8,#2563eb)}

display:flex;
justify-content:space-between;
font-weight:1000
}
.bet-list{display:grid;gap:7px}
.bet{
display:grid;
grid-template-columns:28px 1fr auto;
gap:8px;
align-items:center;
border:1px solid #e2e8f0;
border-radius:11px;
padding:8px
}
.bet.main{border:2px solid #ef4444;background:#fff7f7}
.bet-no{
width:27px;
height:27px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
background:#f1f5f9;
font-size:11px;
font-weight:1000
}
.bet.main .bet-no{background:#dc2626;color:#fff}
.ticket{font-size:18px;font-weight:1000;letter-spacing:1px}
.bet-type{font-size:10px;color:#64748b;margin-top:2px}
.bet-right{text-align:right}
.bet-yen{font-size:11px;font-weight:900}
.odds{font-size:12px;font-weight:1000;color:#2563eb;margin-top:2px}
.odds.missing{color:#94a3b8}
.expected{font-size:10px;color:#64748b;margin-top:1px}
.value{font-size:9px;color:#64748b;margin-top:2px}
.result-box{border-radius:14px;padding:12px;margin-top:8px}
.result-pre{background:#f8fafc;border:1px solid #e2e8f0}
.result-confirmed{background:#eff6ff;border:1px solid #bfdbfe}
.result-settled{background:#ecfdf5;border:1px solid #bbf7d0}
.result-error{background:#fff7ed;border:1px solid #fed7aa}
.result-ticket{font-size:27px;font-weight:1000;letter-spacing:2px}
.payout{font-size:19px;font-weight:1000;color:#047857;margin-top:3px}
.settlement-grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:6px;
margin-top:9px
}
.stat{
background:rgba(255,255,255,.75);
border-radius:9px;
padding:8px 4px;
text-align:center
}
.stat-label{font-size:9px;color:#64748b}
.stat-value{font-size:14px;font-weight:1000;margin-top:2px}
.dev{
background:#fff7ed;
border-left:4px solid #f97316;
border-radius:8px;
padding:10px;
font-size:12px;
line-height:1.65
}
.line-box{display:flex;flex-wrap:wrap;gap:6px}
.line-group{
background:#f8fafc;
border-radius:9px;
padding:7px;
font-size:11px
}
.rider-list{display:grid;gap:6px}
.rider{
display:grid;
grid-template-columns:37px 1fr auto;
gap:8px;
align-items:center;
border:1px solid #e5e7eb;
border-radius:12px;
padding:8px
}
.car{
width:37px;
height:37px;
border-radius:8px;
display:flex;
align-items:center;
justify-content:center;
font-weight:1000
}
.car-1{background:#fff;color:#111827;border:1px solid #94a3b8}
.car-2{background:#111827;color:#fff}
.car-3{background:#dc2626;color:#fff}
.car-4{background:#2563eb;color:#fff}
.car-5{background:#facc15;color:#111827}
.car-6{background:#16a34a;color:#fff}
.car-7{background:#f97316;color:#fff}
.rider-name{font-weight:1000;font-size:13px}
.rider-info{font-size:10px;color:#64748b;margin-top:2px}
.rider-score{text-align:right}
.ai-score{font-weight:1000;font-size:15px}
.rider-finish{font-size:10px;color:#64748b}
.state-pill{
display:inline-block;
border-radius:999px;
padding:4px 8px;
font-size:10px;
font-weight:1000
}
.pill-pre{background:#e2e8f0;color:#475569}
.pill-confirmed{background:#dbeafe;color:#1d4ed8}
.pill-settled{background:#dcfce7;color:#166534}
.pill-error{background:#ffedd5;color:#9a3412}
.notice{
padding:9px 11px;
border-radius:10px;
background:#eff6ff;
color:#1e40af;
font-size:10px;
line-height:1.6
}
.profit-hero{
background:#111827;
color:#fff;
border-radius:18px;
padding:16px;
margin-bottom:10px
}
.profit-title{font-size:12px;opacity:.72}
.profit-main{
display:flex;
justify-content:space-between;
align-items:end;
margin-top:4px
}
.profit-number{font-size:34px;font-weight:1000}
.plus{color:#22c55e}
.minus{color:#f87171}
.profit-sub{text-align:right;font-size:11px;line-height:1.6}
.summary-grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:7px
}
.summary-stat{
background:#f8fafc;
border-radius:10px;
padding:9px 4px;
text-align:center
}
.summary-label{font-size:9px;color:#64748b}
.summary-value{font-size:14px;font-weight:1000;margin-top:2px}
.data-table{
width:100%;
border-collapse:collapse;
font-size:11px;
min-width:560px
}
.table-wrap{overflow-x:auto}
.data-table th{background:#f1f5f9;padding:7px 5px}
.data-table td{
border-bottom:1px solid #e5e7eb;
padding:7px 5px;
text-align:center
}
.profit-plus{color:#16a34a;font-weight:1000}
.profit-minus{color:#dc2626;font-weight:1000}
.strategy{
border:1px solid #e2e8f0;
border-radius:11px;
padding:9px;
margin-bottom:6px
}
.strategy-head{
display:flex;
justify-content:space-between;
gap:8px;
font-weight:900
}
.strategy-stats{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:5px;
margin-top:6px
}
.strategy-stat{
background:#f8fafc;
border-radius:7px;
padding:5px 2px;
text-align:center;
font-size:9px
}
.strategy-stat b{
display:block;
font-size:11px
}
.loading{text-align:center;padding:45px 10px;color:#64748b}
.error{
background:#fff1f2;
color:#be123c;
padding:14px;
border-radius:12px;
line-height:1.6
}
.bottom-nav{
position:fixed;
left:0;
right:0;
bottom:0;
z-index:9999;
height:74px;
background:rgba(255,255,255,.98);
backdrop-filter:blur(12px);
border-top:1px solid #dbe2ea;
display:grid;
grid-template-columns:1fr 1fr;
padding-bottom:env(safe-area-inset-bottom);
box-shadow:0 -3px 12px rgba(0,0,0,.08)
}
.nav-btn{
border:0;
background:#fff;
color:#64748b;
font-weight:1000;
font-size:12px;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
gap:1px
}
.nav-icon{font-size:24px;line-height:27px}
.nav-btn.active{color:#2563eb;background:#eff6ff}
@media(max-width:600px){
main{padding:9px 9px 25px}
.race-grid{grid-template-columns:repeat(6,1fr)}
.settlement-grid,.summary-grid{grid-template-columns:repeat(2,1fr)}
.ticket{font-size:17px}
.race-name{font-size:19px}
}
</style>
</head>
<body>
<header class="header">
<div class="header-inner">
<div>
<div class="title">🚴 競輪AI予想</div>
<div class="date" id="headerDate">データ読み込み中…</div>
</div>
<div class="header-status" id="headerStatus">v6.11</div>
</div>
</header>
<main>
<section id="predictionPage" class="page active">
<div class="card">
<div class="card-title">開催場</div>
<div id="venues" class="venue-scroll"></div>
</div>
<div class="card">
<div class="card-title">
<span id="selectedVenueName">レース</span>
</div>
<div id="raceButtons" class="race-grid"></div>
</div>
<div id="predictionContent">
<div class="loading">データを読み込んでいます…</div>
</div>
</section>
<section id="profitPage" class="page">
<div id="profitContent">
<div class="loading">収支データを読み込んでいます…</div>
</div>
</section>
</main>
<nav class="bottom-nav">

<button
type=“button”
class=“nav-btn active”
id=“navPrediction”

🏁
予想
<button
type=“button”
class=“nav-btn”
id=“navProfit”

💰
収支
</nav>
<script>
const DATA_URL="./data/today.json";
const BET_YEN_DEFAULT=100;
let DATA=null;
let selectedVenue="";
let selectedRace=null;
/* ===============================
   基本
=============================== */
function yen(n){
return Number(n||0).toLocaleString("ja-JP")+"円";
}
function num(n){
return Number(n||0);
}
function escapeHtml(str){
return String(str??"")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");
}
function getRaces(){
return Array.isArray(DATA?.races)?DATA.races:[];
}
function getPrediction(race){
return race?.frozen_prediction||{};
}
function getBets(race){
const p=getPrediction(race);
if(Array.isArray(p.bets))return p.bets;
if(Array.isArray(race?.bets))return race.bets;
return[];
}
function getRanking(race){
const p=getPrediction(race);
if(Array.isArray(p.ranking))return p.ranking;
if(Array.isArray(race?.ai?.ranking))return race.ai.ranking;
return[];
}
function getGrade(race){
return String(
race?.frozen_prediction?.verdict?.rank||
race?.verdict?.rank||
""
).toUpperCase();
}
function getBetYen(bet){
return num(bet?.bet_yen||BET_YEN_DEFAULT);
}
/* ===============================
   チケット
=============================== */
function isValidTicket(a){
return Array.isArray(a)&&
a.length===3&&
a.every(n=>
Number.isInteger(Number(n))&&
Number(n)>=1&&
Number(n)<=7
)&&
new Set(a.map(Number)).size===3;
}
function normalizeTicket(value){
const m=String(value??"").match(
/[1-7]\s*[-－ー→>]\s*[1-7]\s*[-－ー→>]\s*[1-7]/
);
if(!m)return"";
const a=m[0]
.replaceAll("－","-")
.replaceAll("ー","-")
.replaceAll("→","-")
.replaceAll(">","-")
.replace(/\s/g,"")
.split("-")
.map(Number);
return isValidTicket(a)?a.join("-"):"";
}
/* ===============================
   着順
=============================== */
function getFinishTicket(race){
const finish=race?.result?.finish;
if(Array.isArray(finish)&&finish.length>=3){
const a=finish.slice(0,3).map(Number);
if(isValidTicket(a))return a.join("-");
}
if(typeof finish==="string"){
const ticket=normalizeTicket(finish);
if(ticket)return ticket;
}
return"";
}
/* ===============================
   払戻
=============================== */
function parsePayoutSource(source){
const s=String(source||"");
const m=s.match(
/3連単\s*([1-7])\s*[→\-－ー>]\s*([1-7])\s*[→\-－ー>]\s*([1-7])\s*([0-9,]+)円/
);
if(!m)return null;
const ticket=normalizeTicket(
`${m[1]}-${m[2]}-${m[3]}`
);
if(!ticket)return null;
return{
ticket,
yen:Number(m[4].replace(/,/g,""))
};
}
function getPayoutInfo(race){
const result=race?.result||{};
const source=parsePayoutSource(
result.payout_source
);
if(source){
return{
ticket:source.ticket,
yen:source.yen,
available:true
};
}
const ticket=normalizeTicket(
result.payout_3tan
);
if(ticket&&result.payout_3tan_yen!=null){
return{
ticket,
yen:num(result.payout_3tan_yen),
available:true
};
}
return{
ticket:"",
yen:0,
available:false
};
}
/* ===============================
   収支確定
=============================== */
function isSettled(race){
return String(
race?.settlement?.status||""
).toLowerCase()==="settled";
}
/* ===============================
   レース状態
=============================== */
function getRaceState(race){
const result=race?.result||{};
const finish=getFinishTicket(race);
if(isSettled(race))
return"settled";
if(result.finished===true&&finish){
const payout=getPayoutInfo(race);
return payout.available?"confirmed":"result";
}
if(result.finished!==true&&!finish)
return"pre";
if(result.finished===true&&!finish)
return"error";
return"pre";
}
function stateText(race){
switch(getRaceState(race)){
case"settled":
return"✅ 結果・収支確定";
case"confirmed":
return"✅ 結果確定・収支集計待ち";
case"result":
return"🏁 着順確定・払戻待ち";
case"error":
return"⚠️ 結果データ確認中";
default:
return"🕐 発走前";
}
}
function stateClass(race){
switch(getRaceState(race)){
case"settled":
return"pill-settled";
case"confirmed":
case"result":
return"pill-confirmed";
case"error":
return"pill-error";
default:
return"pill-pre";
}
}
/* ===============================
   オッズ
=============================== */
function getBetOdds(race,bet){
const own=bet?.odds;
if(
own!==null&&
own!==undefined&&
Number(own)>0
)
return Number(own);
const map=race?.odds?.odds;
if(
map&&
typeof map==="object"&&
map[bet?.ticket]!=null&&
Number(map[bet.ticket])>0
)
return Number(map[bet.ticket]);
return null;
}
/* ===============================
   的中
=============================== */
function ticketHit(bet,race){
const result=getFinishTicket(race);
return!!result&&
String(bet?.ticket)===result;
}
/* ===============================
   ページ切替
=============================== */
function switchPage(page){
const predictionPage=
document.getElementById("predictionPage");
const profitPage=
document.getElementById("profitPage");
const navPrediction=
document.getElementById("navPrediction");
const navProfit=
document.getElementById("navProfit");
if(page==="profit"){
predictionPage.classList.remove("active");
profitPage.classList.add("active");
navPrediction.classList.remove("active");
navProfit.classList.add("active");
renderProfitPage();
}else{
profitPage.classList.remove("active");
predictionPage.classList.add("active");
navProfit.classList.remove("active");
navPrediction.classList.add("active");
}
window.scrollTo(0,0);
}
/* ===============================
   データ
=============================== */
async function loadData(){
try{
const response=await fetch(
DATA_URL+"?t="+Date.now(),
{
cache:"no-store"
}
);
if(!response.ok)
throw new Error("today.jsonを取得できませんでした");
DATA=await response.json();
if(!Array.isArray(DATA.races))
throw new Error("today.jsonの形式が正しくありません");
document.getElementById("headerDate").textContent=
`${DATA.target_date||""}　全${DATA.races.length}R`;
document.getElementById("headerStatus").textContent=
`v${DATA.version||"6.11"}`;
if(!selectedVenue){
selectedVenue=
DATA.races[0]?.venue_name||"";
}
let venueRaces=getRaces().filter(
r=>r.venue_name===selectedVenue
);
if(!selectedRace){
selectedRace=venueRaces[0]||null;
}
renderVenues();
renderRaceButtons();
renderRace();
renderProfitPage();
}catch(error){
console.error(error);
document.getElementById(
"predictionContent"
).innerHTML=
`
<div class="error">
データの読み込みに失敗しました。<br>
${escapeHtml(error.message)}
</div>
`;
document.getElementById(
"profitContent"
).innerHTML=
`
<div class="error">
収支データを読み込めませんでした。
</div>
`;
}
}
/* ===============================
   会場表示
   ★ここを修正
   onclickを使わない
=============================== */
function renderVenues(){
const venues=[
...new Set(
getRaces()
.map(r=>r.venue_name)
.filter(Boolean)
)
];
const container=
document.getElementById("venues");
container.innerHTML=
venues.map((venue,index)=>`
<button
type="button"
class="venue-btn ${venue===selectedVenue?"active":""}"
data-venue-index="${index}"
>
${escapeHtml(venue)}
</button>
`).join("");
/* ボタンに直接イベントを登録 */
container
.querySelectorAll(".venue-btn")
.forEach(button=>{
button.addEventListener(
"click",
function(){
const index=
Number(this.dataset.venueIndex);
const venue=venues[index];
selectVenue(venue);
},
{passive:true}
);
});
}
/* ===============================
   会場選択
=============================== */
function selectVenue(venue){
selectedVenue=venue;
/* 必ずその会場の1Rを選択 */
const venueRaces=
getRaces()
.filter(
r=>r.venue_name===venue
)
.sort(
(a,b)=>
Number(a.race_no)-Number(b.race_no)
);
selectedRace=
venueRaces[0]||null;
renderVenues();
renderRaceButtons();
renderRace();
window.scrollTo(0,0);
}
/* ===============================
   レースボタン
=============================== */
function renderRaceButtons(){
const races=
getRaces()
.filter(
r=>r.venue_name===selectedVenue
)
.sort(
(a,b)=>
Number(a.race_no)-Number(b.race_no)
);
document.getElementById(
"selectedVenueName"
).textContent=
`${selectedVenue||"レース"}　${races.length}R`;
const container=
document.getElementById("raceButtons");
container.innerHTML=
races.map((r,index)=>{
const state=getRaceState(r);
return`
<button
type="button"
class="race-btn ${state} ${
selectedRace&&
Number(selectedRace.race_no)===
Number(r.race_no)
?"active":""
}"
data-race-index="${index}"
>
${r.race_no}R
</button>
`;
}).join("");
container
.querySelectorAll(".race-btn")
.forEach(button=>{
button.addEventListener(
"click",
function(){
const index=
Number(this.dataset.raceIndex);
selectedRace=races[index]||null;
renderRaceButtons();
renderRace();
window.scrollTo(0,0);
},
{passive:true}
);
});
}
/* ===============================
   予想
=============================== */
function renderRace(){
if(!selectedRace){
document.getElementById(
"predictionContent"
).innerHTML=
`
<div class="loading">
レースがありません。
</div>
`;
return;
}
const race=selectedRace;
const prediction=getPrediction(race);
const verdict=
prediction.verdict||
race.verdict||
{};
const grade=getGrade(race);
document.getElementById(
"predictionContent"
).innerHTML=
`
<div class="card">

/* ===============================
   買い目
=============================== */
function renderBets(race){
const bets=getBets(race);
if(!bets.length)return"";
return`
<div class="card">
<div class="card-title">
🎯 AIおすすめ買い目
<span class="small">
${bets.length}点
</span>
</div>
<div class="bet-list">
${bets.map((bet,index)=>{
const odds=getBetOdds(race,bet);
const potential=
odds
?Math.round(getBetYen(bet)*odds)
:0;
return`
<div class="bet ${index===0?"main":""}">
<div class="bet-no">
${index+1}
</div>
<div>
<div class="ticket">
${escapeHtml(bet.ticket)}
</div>
<div class="bet-type">
${escapeHtml(bet.type||"")}
</div>
</div>
<div class="bet-right">
<div class="bet-yen">
${yen(getBetYen(bet))}
</div>
<div class="odds ${odds?"":"missing"}">
${
odds
?`${odds.toFixed(1)}倍`
:"オッズ未取得"
}
</div>
${
odds
?`
<div class="expected">
100円→${yen(potential)}
</div>
`
:""
}
<div class="value">
${escapeHtml(bet.value_flag||"")}
</div>
</div>
</div>
`;
}).join("")}
</div>
</div>
`;
}
/* ===============================
   結果
=============================== */
function renderResult(race){
const state=getRaceState(race);
const bets=getBets(race);
const finish=getFinishTicket(race);
const payout=getPayoutInfo(race);
const settlement=race.settlement||{};
const hit=bets.find(
bet=>ticketHit(bet,race)
);
if(state==="pre"){
return`
<div class="card">
<div class="card-title">
🏆 レース結果
</div>
<div class="result-box result-pre">
<b>🕐 発走前</b>
<br>
<span class="small">
まだレース結果はありません。
</span>
</div>
</div>
`;
}
if(state==="error"){
return`
<div class="card">
<div class="card-title">
🏆 レース結果
</div>
<div class="result-box result-error">
<b>⚠️ 結果データ確認中</b>
<br>
<span class="small">
取得された結果データが正しくないため、
着順・的中・収支には反映していません。
</span>
</div>
</div>
`;
}
if(state==="result"){
return`
<div class="card">
<div class="card-title">
🏆 レース結果
</div>
<div class="result-box result-confirmed">
<div class="small">
着順確定
</div>
<div class="result-ticket">
${escapeHtml(finish)}
</div>
<div class="small">
${
payout.available
?`払戻 ${yen(payout.yen)}`
:"払戻待ち"
}
</div>
<div class="settlement-grid">
<div class="stat">
<div class="stat-label">AI買い目</div>
<div class="stat-value">${bets.length}点</div>
</div>
<div class="stat">
<div class="stat-label">的中</div>
<div class="stat-value">${hit?"🎯":"－"}</div>
</div>
<div class="stat">
<div class="stat-label">投資</div>
<div class="stat-value">未確定</div>
</div>
<div class="stat">
<div class="stat-label">収支</div>
<div class="stat-value">未確定</div>
</div>
</div>
</div>
</div>
`;
}
return`
<div class="card">
<div class="card-title">
🏆 レース結果
</div>
<div class="result-box result-settled">
<div class="small">
結果・払戻・収支確定
</div>
<div class="result-ticket">
${escapeHtml(
finish||
settlement.hit_ticket||
payout.ticket||
"－"
)}
</div>
<div class="payout">
払戻 ${yen(settlement.payout)}
</div>
<div class="settlement-grid">
<div class="stat">
<div class="stat-label">AI買い目</div>
<div class="stat-value">${bets.length}点</div>
</div>
<div class="stat">
<div class="stat-label">的中</div>
<div class="stat-value">${settlement.hit?"🎯":"－"}</div>
</div>
<div class="stat">
<div class="stat-label">投資</div>
<div class="stat-value">${yen(settlement.investment)}</div>
</div>
<div class="stat">
<div class="stat-label">収支</div>
<div class="stat-value ${
num(settlement.profit)>=0
?"profit-plus"
:"profit-minus"
}">
${num(settlement.profit)>=0?"+":""}
${yen(settlement.profit)}
</div>
</div>
</div>
${
settlement.hit_ticket
?`
<div
style="margin-top:8px;font-weight:1000;color:#047857"
>
🎯 的中買い目：
${escapeHtml(settlement.hit_ticket)}
</div>
`
:""
}
</div>
</div>
`;
}

/* ===============================
   ライン
=============================== */
function renderLine(race){
const groups=race.line_groups;
const line=race.line;
if(
!(
(Array.isArray(groups)&&groups.length)||
(Array.isArray(line)&&line.length)
)
){
return`
<div class="card">
<div class="card-title">
🚴 ライン
</div>
<div class="small">
ライン情報は取得されていません。
</div>
</div>
`;
}
return`
<div class="card">
<div class="card-title">
🚴 ライン
</div>
<div class="line-box">
${
Array.isArray(groups)&&groups.length
?groups.map(g=>`
<div class="line-group">
${escapeHtml(JSON.stringify(g))}
</div>
`).join("")
:escapeHtml(JSON.stringify(line))
}
</div>
</div>
`;
}

/* ===============================
   選手
=============================== */
function renderRiders(race){
const riders=
Array.isArray(race.riders)
?race.riders
:[];
if(!riders.length)return"";
const rankingMap=
new Map(
getRanking(race).map(
(item,index)=>[
Number(item.car_no),
{
rank:index+1,
score:item.score
}
]
)
);
return`
<div class="card">
<div class="card-title">
🚴 出走選手
</div>
<div class="rider-list">
${riders.map(item=>{
const ai=
rankingMap.get(
Number(item.car_no)
);
return`
<div class="rider">
<div class="car car-${item.car_no}">
${item.car_no}
</div>
<div>
<div class="rider-name">
${escapeHtml(item.name||"")}
</div>
<div class="rider-info">
${escapeHtml(item.style||"")}
${item.period?`　${item.period}期`:""}
${item.prefecture
?`　${escapeHtml(item.prefecture)}`
:""}
</div>
<div class="rider-info">
直近：
${item.finish_1||0}勝 /
${item.finish_2||0}回 /
${item.finish_3||0}回 /
${item.finish_out||0}着外
</div>
</div>
<div class="rider-score">
${
ai
?`
<div class="ai-score">
${num(ai.score).toFixed(1)}
</div>
<div class="rider-finish">
AI ${ai.rank}位
</div>
`
:`
<div class="ai-score">－</div>
`
}
</div>
</div>
`;
}).join("")}
</div>
</div>
`;
}
