<style>

========================= */

========================= */

<script>
"use strict";
/* =========================================================
   Configuration
========================================================= */
const DATA_URL = "./data/today.json";
const BET_YEN_DEFAULT = 100;
let DATA = null;
let RACES = [];
let currentVenueIndex = 0;
let currentRaceIndex = 0;
/* =========================================================
   Safe helpers
========================================================= */
function escapeHtml(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}
function yen(value) {
  const n = Number(value || 0);
  return "¥" + n.toLocaleString("ja-JP");
}
function num(value, fallback = 0) {
  const n = Number(value);
  return Number.isFinite(n) ? n : fallback;
}
function safeArray(value) {
  return Array.isArray(value) ? value : [];
}
function safeObject(value) {
  return value && typeof value === "object" && !Array.isArray(value)
    ? value
    : {};
}
function normalizeTicket(value) {
  if (value === null || value === undefined) {
    return "";
  }
  return String(value)
    .trim()
    .replace(/[－ー→>]/g, "-")
    .replace(/\s+/g, "")
    .replace(/-+/g, "-");
}
function isValidTicket(ticket) {
  const normalized = normalizeTicket(ticket);
  const parts = normalized.split("-");
  if (parts.length !== 3) {
    return false;
  }
  const nums = parts.map(Number);
  if (nums.some(n => !Number.isInteger(n) || n < 1 || n > 7)) {
    return false;
  }
  return new Set(nums).size === 3;
}
function formatTicket(ticket) {
  const t = normalizeTicket(ticket);
  return isValidTicket(t) ? t : "—";
}
function getBetYen(bet) {
  return num(
    bet?.bet_yen ??
    bet?.yen ??
    BET_YEN_DEFAULT,
    BET_YEN_DEFAULT
  );
}
/* =========================================================
   Data access
========================================================= */
function getRaces(data) {
  if (Array.isArray(data?.races)) {
    return data.races;
  }
  if (Array.isArray(data?.data?.races)) {
    return data.data.races;
  }
  if (Array.isArray(data?.venues)) {
    const result = [];
    data.venues.forEach(venue => {
      safeArray(venue.races).forEach(race => {
        result.push({
          ...race,
          venue_name: race.venue_name || venue.venue_name || venue.name,
          venue_code: race.venue_code || venue.venue_code || venue.code
        });
      });
    });
    return result;
  }
  return [];
}
function getPrediction(race) {
  return safeObject(
    race?.frozen_prediction ||
    race?.prediction ||
    race?.ai_prediction
  );
}
function getBets(race) {
  const prediction = getPrediction(race);
  if (Array.isArray(prediction.bets)) {
    return prediction.bets;
  }
  if (Array.isArray(race?.bets)) {
    return race.bets;
  }
  return [];
}
function getRanking(race) {
  const prediction = getPrediction(race);
  if (Array.isArray(prediction.ranking)) {
    return prediction.ranking;
  }
  if (Array.isArray(race?.ai?.ranking)) {
    return race.ai.ranking;
  }
  return [];
}
function getGrade(race) {
  const prediction = getPrediction(race);
  const verdict = safeObject(
    prediction.verdict ||
    race?.verdict
  );
  return {
    rank: verdict.rank || "—",
    label: verdict.label || "",
    score: num(verdict.score, 0),
    reason: verdict.reason || ""
  };
}
/* =========================================================
   Result validation
========================================================= */
function getValidFinish(result) {
  if (!result || !Array.isArray(result.finish)) {
    return null;
  }
  const finish = result.finish
    .slice(0, 7)
    .map(Number);
  if (finish.length < 3) {
    return null;
  }
  const validNumbers = finish.every(
    n => Number.isInteger(n) && n >= 1 && n <= 7
  );
  if (!validNumbers) {
    return null;
  }
  const unique = new Set(finish);
  if (unique.size !== finish.length) {
    return null;
  }
  return finish;
}
function getFinishTicket(race) {
  const finish = getValidFinish(race?.result);
  if (!finish) {
    return "";
  }
  const ticket = finish.slice(0, 3).join("-");
  return isValidTicket(ticket) ? ticket : "";
}
/* =========================================================
   Settlement
========================================================= */
function isSettled(race) {
  return race?.settlement?.status === "settled";
}
function getPayoutInfo(race) {
  const result = safeObject(race?.result);
  const payout =
    result.payout_3tan_yen ??
    result.payout_3t_yen ??
    result.payout_yen ??
    race?.settlement?.payout ??
    0;
  const ticket =
    result.payout_3tan ||
    result.payout_3t ||
    race?.settlement?.hit_ticket ||
    "";
  const available =
    result.payout_available === true ||
    Number(payout) > 0;
  return {
    available,
    payout: num(payout, 0),
    ticket: isValidTicket(ticket) ? normalizeTicket(ticket) : ""
  };
}
function getRaceState(race) {
  if (isSettled(race)) {
    return "settled";
  }
  const result = safeObject(race?.result);
  const finish = getValidFinish(result);
  /*
   * 正常な結果確定
   */
  if (result.finished === true && finish) {
    const payout = getPayoutInfo(race);
    if (payout.available) {
      return "confirmed";
    }
    return "payout";
  }
  /*
   * finish が存在するのに finished=false、
   * または finished=trueなのに不正な着順。
   * upstreamの一時的不整合として扱う。
   */
  if (finish && result.finished !== true) {
    return "error";
  }
  if (result.finished === true && !finish) {
    return "error";
  }
  /*
   * 本当にまだ結果がない状態
   */
  return "pre";
}
function getStateLabel(state) {
  switch (state) {
    case "settled":
      return "収支確定";
    case "confirmed":
      return "結果確定";
    case "payout":
      return "払戻待ち";
    case "error":
      return "結果確認中";
    case "pre":
    default:
      return "発走前";
  }
}
function getStateClass(state) {
  switch (state) {
    case "settled":
      return "state-settled";
    case "confirmed":
      return "state-confirmed";
    case "payout":
      return "state-payout";
    case "error":
      return "state-error";
    case "pre":
    default:
      return "state-pre";
  }
}
/* =========================================================
   Odds
========================================================= */
function findOddsInObject(obj, ticket) {
  if (!obj || typeof obj !== "object") {
    return null;
  }
  const target = normalizeTicket(ticket);
  const directKeys = [
    target,
    target.replace(/-/g, ""),
    "sanrentan",
    "3tan",
    "3連単"
  ];
  for (const key of directKeys) {
    if (
      Object.prototype.hasOwnProperty.call(obj, key) &&
      typeof obj[key] !== "object"
    ) {
      const value = Number(obj[key]);
      if (Number.isFinite(value) && value > 0) {
        return value;
      }
    }
  }
  for (const [key, value] of Object.entries(obj)) {
    if (normalizeTicket(key) === target) {
      const n = Number(value);
      if (Number.isFinite(n) && n > 0) {
        return n;
      }
    }
    if (Array.isArray(value)) {
      for (const item of value) {
        if (!item || typeof item !== "object") {
          continue;
        }
        const itemTicket =
          item.ticket ??
          item.bet ??
          item.combination ??
          item.combo ??
          item.name;
        if (normalizeTicket(itemTicket) === target) {
          const itemOdds =
            item.odds ??
            item.value ??
            item.rate;
          const n = Number(itemOdds);
          if (Number.isFinite(n) && n > 0) {
            return n;
          }
        }
      }
    }
  }
  return null;
}
function getBetOdds(race, bet) {
  const direct = Number(bet?.odds);
  if (Number.isFinite(direct) && direct > 0) {
    return direct;
  }
  const ticket = normalizeTicket(bet?.ticket);
  if (!ticket) {
    return null;
  }
  const odds = race?.odds;
  if (!odds) {
    return null;
  }
  if (Array.isArray(odds)) {
    for (const item of odds) {
      if (!item || typeof item !== "object") {
        continue;
      }
      const itemTicket =
        item.ticket ??
        item.bet ??
        item.combination ??
        item.combo;
      if (normalizeTicket(itemTicket) === ticket) {
        const value = Number(
          item.odds ??
          item.value ??
          item.rate
        );
        if (Number.isFinite(value) && value > 0) {
          return value;
        }
      }
    }
  }
  if (typeof odds === "object") {
    const found = findOddsInObject(odds, ticket);
    if (found !== null) {
      return found;
    }
    if (odds.odds && typeof odds.odds === "object") {
      const nested = findOddsInObject(odds.odds, ticket);
      if (nested !== null) {
        return nested;
      }
    }
    if (odds.sanrentan && typeof odds.sanrentan === "object") {
      const nested = findOddsInObject(odds.sanrentan, ticket);
      if (nested !== null) {
        return nested;
      }
    }
  }
  return null;
}
/* =========================================================
   Navigation
========================================================= */
function showPage(page) {

/* =========================================================
   Venue
========================================================= */
function getVenues() {
  const map = new Map();
  RACES.forEach((race, index) => {
    const name =
      race?.venue_name ||
      race?.venue ||
      race?.place ||
      "会場不明";
    const code =
      race?.venue_code ||
      race?.jo_code ||
      "";
    const key = String(code || name);
    if (!map.has(key)) {
      map.set(key, {
        key,
        name,
        code,
        raceIndexes: []
      });
    }
    map.get(key).raceIndexes.push(index);
  });
  return Array.from(map.values());
}
function renderVenues() {
  const container = document.getElementById("venueList");
  const venues = getVenues();
  if (!venues.length) {
    container.innerHTML =
      '<div class="empty-box">開催データがありません。</div>';
    return;
  }
  if (currentVenueIndex >= venues.length) {
    currentVenueIndex = 0;
  }
  container.innerHTML = venues
    .map((venue, index) => `
      <button
        type="button"
        class="venue-btn ${index === currentVenueIndex ? "active" : ""}"
        data-venue-index="${index}">
        ${escapeHtml(venue.name)}
      </button>
    `)
    .join("");
  container.querySelectorAll(".venue-btn").forEach(button => {
    button.addEventListener("click", () => {
      const index = Number(button.dataset.venueIndex);
      selectVenue(index);
    });
  });
}
function selectVenue(index) {
  const venues = getVenues();
  if (!venues[index]) {
    return;
  }
  currentVenueIndex = index;
  const venue = venues[index];
  currentRaceIndex = venue.raceIndexes.length
    ? venue.raceIndexes[0]
    : 0;
  renderVenues();
  renderRaceButtons();
  renderRace();
}
/* =========================================================
   Race buttons
========================================================= */
function renderRaceButtons() {
  const container = document.getElementById("raceList");
  const venues = getVenues();
  const venue = venues[currentVenueIndex];
  if (!venue) {
    container.innerHTML = "";
    return;
  }
  container.innerHTML = venue.raceIndexes
    .map(index => {
      const race = RACES[index];
      const raceNo = race?.race_no ?? race?.race ?? "?";
      return `
        <button
          type="button"
          class="race-btn ${index === currentRaceIndex ? "active" : ""}"
          data-race-index="${index}">
          ${escapeHtml(raceNo)}R
        </button>
      `;
    })
    .join("");
  container.querySelectorAll(".race-btn").forEach(button => {
    button.addEventListener("click", () => {
      const index = Number(button.dataset.raceIndex);
      currentRaceIndex = index;
      renderRaceButtons();
      renderRace();
    });
  });
}

function renderLine(race) {
  const container = document.getElementById("lineCard");
  const line = safeArray(race?.line);
  const groups = safeArray(race?.line_groups);
  let items = [];
  if (line.length) {
    items = line.map(item => {
      if (Array.isArray(item)) {
        return item.join("-");
      }
      if (typeof item === "object") {
        return (
          item.cars ||
          item.members ||
          item.line ||
          item.name ||
          ""
        );
      }
      return String(item);
    }).filter(Boolean);
  }
  if (!items.length && groups.length) {
    items = groups.map(group => {
      if (Array.isArray(group)) {
        return group.join("-");
      }
      if (typeof group === "object") {
        return (
          group.cars ||
          group.members ||
          group.line ||
          group.name ||
          ""
        );
      }
      return String(group);
    }).filter(Boolean);
  }
  container.innerHTML = `
    <div class="card">
      <div class="card-title">🚴 ライン</div>
      ${
        items.length
          ? `
            <div class="line-list">
              ${items.map(item => `
                <div class="line-chip">
                  ${escapeHtml(item)}
                </div>
              `).join("")}
            </div>
          `
          : `
            <div class="empty-box">
              ライン情報は取得されていません。

      hit: settlement.hit === true,
      ticket: settlement.hit_ticket || "",
      investment: num(
        settlement.investment,
        getBets(race).reduce(
          (sum, bet) => sum + getBetYen(bet),
          0
        )
      ),
      payout: num(settlement.payout, 0),
      profit: num(settlement.profit, 0)
    });
  });
  if (!rows.length) {
    container.innerHTML = `
      <div class="card">
        <div class="card-title">🧾 レース別収支</div>
        <div class="empty-box">
          まだ収支確定したレースがありません。
        </div>
      </div>
    `;
    return;
  }
  container.innerHTML = `
    <div class="card">
      <div class="card-title">🧾 レース別収支</div>
      <div class="profit-table-wrap">
        <table class="profit-table">
          <thead>
            <tr>
              <th>会場</th>
              <th>R</th>
              <th>結果</th>
              <th>投資</th>
              <th>払戻</th>
              <th>収支</th>
            </tr>
          </thead>
          <tbody>
            ${rows.map(row => `
              <tr>
                <td>
                  ${escapeHtml(row.venue)}
                </td>
                <td>
                  ${escapeHtml(row.raceNo)}R
                </td>
                <td>
                  ${
                    row.hit
                      ? `<span class="hit">的中 ${escapeHtml(row.ticket)}</span>`
                      : `<span class="miss">ハズレ</span>`
                  }
                </td>
                <td>
                  ${yen(row.investment)}
                </td>
                <td>
                  ${yen(row.payout)}
                </td>
                <td class="${renderMoneyClass(row.profit)}">
                  ${yen(row.profit)}
                </td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      </div>
    </div>
  `;
}
/* =========================================================
   Backtests
========================================================= */
function renderStrategies() {
  const container = document.getElementById("strategyCard");
  const backtests = safeObject(DATA?.backtests);
  const entries = Object.entries(backtests);
  if (!entries.length) {
    container.innerHTML = "";
    return;
  }
  container.innerHTML = `
    <div class="card">
      <div class="card-title">🧪 バックテスト</div>
      <div class="profit-table-wrap">
        <table class="profit-table">
          <thead>
            <tr>
              <th>戦略</th>
              <th>R</th>
              <th>投資</th>
              <th>払戻</th>
              <th>収支</th>
              <th>回収率</th>
            </tr>
          </thead>
          <tbody>
            ${entries.map(([name, value]) => {
              const v = safeObject(value);
              return `
                <tr>
                  <td>
                    ${escapeHtml(name)}
                  </td>
                  <td>
                    ${num(v.races, 0)}
                  </td>
                  <td>
                    ${yen(v.investment)}
                  </td>
                  <td>
                    ${yen(v.payout)}
                  </td>
                  <td class="${renderMoneyClass(v.profit)}">
                    ${yen(v.profit)}
                  </td>
                  <td>
                    ${num(v.roi, 0).toFixed(1)}%
                  </td>
                </tr>
              `;
            }).join("")}
          </tbody>
        </table>
      </div>
    </div>
  `;
}
/* =========================================================
   Today's recommendations
========================================================= */
function renderRecommendations() {
  const container =
    document.getElementById("recommendationCard");
  const recommendations =
    safeObject(DATA?.today_recommendations);
  const entries =
    Object.entries(recommendations);
  if (!entries.length) {
    container.innerHTML = "";
    return;
  }
  container.innerHTML = `
    <div class="card">
      <div class="card-title">🔥 今日のおすすめ</div>
      <div class="ranking-list">
        ${entries.map(([name, raw]) => {
          const value =
            raw && typeof raw === "object"
              ? raw
              : {};
          const description =
            value.description ||
            value.reason ||
            value.ticket ||
            value.hit_ticket ||
            "";
          return `
            <div class="ranking-row">
              <div class="ranking-position">
                🔥
              </div>
              <div class="ranking-name">
                ${escapeHtml(name)}
                ${
                  description
                    ? `<div class="ranking-detail">
                        ${escapeHtml(description)}
                       </div>`
                    : ""
                }
              </div>
              <div></div>
              <div></div>
            </div>
          `;
        }).join("")}
      </div>
    </div>
  `;
}
/* =========================================================
   Load
========================================================= */
async function loadData() {
  const updateInfo =
    document.getElementById("updateInfo");
  try {
    updateInfo.textContent =
      "データを読み込んでいます...";
    const response = await fetch(
      DATA_URL + "?t=" + Date.now(),
      {
        cache: "no-store"
      }
    );
    if (!response.ok) {
      throw new Error(
        "today.json の取得に失敗しました。HTTP " +
        response.status
      );
    }
    const data = await response.json();
    const races = getRaces(data);
    if (!races.length) {
      throw new Error(
        "today.json にレースデータがありません。"
      );
    }
    DATA = data;
    RACES = races;
    if (currentRaceIndex >= RACES.length) {
      currentRaceIndex = 0;
    }
    const venues = getVenues();
    if (
      currentVenueIndex >= venues.length
    ) {
      currentVenueIndex = 0;
    }
    const currentVenue =
      venues[currentVenueIndex];
    if (
      !currentVenue ||
      !currentVenue.raceIndexes.includes(currentRaceIndex)
    ) {
      currentRaceIndex =
        currentVenue?.raceIndexes?.[0] ??
        0;
    }
    const targetDate =
      data.target_date ||
      data.date ||
      "";
    const updatedAt =
      data.updated_at ||
      "";
    updateInfo.textContent =
      `${targetDate ? targetDate + " / " : ""}` +
      `${RACES.length}レース` +
      `${updatedAt ? " / 更新 " + updatedAt : ""}`;
    renderVenues();
    renderRaceButtons();
    renderRace();
    renderProfit();
  } catch (error) {
    console.error(error);
    updateInfo.textContent =
      "データ読み込みエラー";
    document.getElementById("venueList").innerHTML = "";
    document.getElementById("raceList").innerHTML = "";
    document.getElementById("raceContent").innerHTML = `
      <div class="error-box">
        <strong>データを読み込めませんでした。</strong>
        <br><br>
        ${escapeHtml(error.message)}
        <br><br>
        <small>
          GitHub Pagesのデータ更新直後は、
          少し時間を置いて再読み込みしてください。
        </small>
      </div>
    `;
    document.getElementById("profitContent").innerHTML = `
      <div class="error-box">
        収支データを読み込めませんでした。
      </div>
    `;
  }
}
/* =========================================================
   Start
========================================================= */
function init() {
  bindNavigation();
  loadData();
  /*
   * 5分ごとに最新today.jsonを取得。
   * 選択中の会場・レースは可能な限り維持する。
   */
  setInterval(() => {
    loadData();
  }, 5 * 60 * 1000);
}
if (
  document.readyState === "loading"
) {
  document.addEventListener(
    "DOMContentLoaded",
    init
  );
} else {
  init();
}
</script>
</body>
