<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>競輪AI予想</title>
<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  background:#f3f5f8;
  color:#172033;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Noto Sans JP",Arial,sans-serif;
  padding-bottom:82px;
}
button,select{font:inherit}
button{cursor:pointer}
.header{
  position:sticky;
  top:0;
  z-index:50;
  background:#111827;
  color:#fff;
  padding:14px 14px 12px;
  box-shadow:0 2px 12px rgba(0,0,0,.18);
}
.header-inner{
  max-width:900px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}
.title{
  font-size:20px;
  font-weight:900;
}
.date{
  font-size:12px;
  opacity:.8;
  margin-top:2px;
}
.status{
  font-size:11px;
  background:#1f2937;
  border-radius:999px;
  padding:6px 9px;
  white-space:nowrap;
}
main{
  max-width:900px;
  margin:auto;
  padding:12px 12px 30px;
}
.page{display:none}
.page.active{display:block}
.card{
  background:#fff;
  border-radius:16px;
  padding:14px;
  margin-bottom:12px;
  box-shadow:0 2px 10px rgba(15,23,42,.07);
}
.card-title{
  font-size:15px;
  font-weight:900;
  margin-bottom:10px;
}
.muted{color:#64748b;font-size:12px}
.small{font-size:11px;color:#64748b}
.venue-scroll{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:2px 1px 8px;
  scrollbar-width:none;
}
.venue-scroll::-webkit-scrollbar{display:none}
.venue-btn{
  flex:0 0 auto;
  border:1px solid #dbe1ea;
  background:#fff;
  color:#334155;
  border-radius:11px;
  padding:9px 13px;
  font-weight:800;
}
.venue-btn.active{
  background:#111827;
  color:#fff;
  border-color:#111827;
}
.race-grid{
  display:grid;
  grid-template-columns:repeat(12,1fr);
  gap:6px;
}
.race-btn{
  border:1px solid #dbe1ea;
  background:#fff;
  border-radius:9px;
  padding:8px 2px;
  font-weight:800;
  color:#334155;
}
.race-btn.active{
  background:#2563eb;
  border-color:#2563eb;
  color:#fff;
}
.race-btn.finished{
  position:relative;
}
.race-btn.finished:after{
  content:"✓";
  position:absolute;
  top:-5px;
  right:-3px;
  background:#16a34a;
  color:#fff;
  font-size:9px;
  width:15px;
  height:15px;
  line-height:15px;
  border-radius:50%;
}
.race-head{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:10px;
}
.race-name{
  font-size:21px;
  font-weight:900;
}
.race-meta{
  color:#64748b;
  font-size:12px;
  margin-top:3px;
}
.grade{
  padding:7px 10px;
  border-radius:9px;
  font-weight:900;
  font-size:13px;
  white-space:nowrap;
}
.grade-S{background:#fee2e2;color:#b91c1c}
.grade-A{background:#ffedd5;color:#c2410c}
.grade-B{background:#fef3c7;color:#92400e}
.grade-C{background:#e2e8f0;color:#475569}
.key-box{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:12px;
}
.key-item{
  text-align:center;
  border-radius:12px;
  padding:10px 5px;
  background:#f8fafc;
}
.key-label{font-size:11px;color:#64748b}
.key-num{
  font-size:25px;
  font-weight:1000;
  margin-top:2px;
}
.main-num{color:#dc2626}
.opp-num{color:#2563eb}
.dark-num{color:#ea580c}
.verdict{
  border-radius:14px;
  padding:13px;
  margin-top:12px;
  border-left:5px solid #64748b;
  background:#f8fafc;
}
.verdict.S{border-color:#dc2626;background:#fff1f2}
.verdict.A{border-color:#f97316;background:#fff7ed}
.verdict.B{border-color:#eab308;background:#fefce8}
.verdict.C{border-color:#64748b;background:#f8fafc}
.verdict-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
}
.verdict-label{
  font-weight:1000;
  font-size:17px;
}
.verdict-score{
  font-size:13px;
  font-weight:900;
  color:#475569;
}
.bet-list{
  display:flex;
  flex-direction:column;
  gap:7px;
}
.bet{
  display:grid;
  grid-template-columns:34px 1fr auto;
  align-items:center;
  gap:8px;
  padding:10px;
  border:1px solid #e2e8f0;
  border-radius:12px;
  background:#fff;
}
.bet-no{
  width:28px;
  height:28px;
  display:grid;
  place-items:center;
  border-radius:50%;
  background:#eef2ff;
  color:#3730a3;
  font-size:12px;
  font-weight:900;
}
.ticket{
  font-size:20px;
  font-weight:1000;
  letter-spacing:1px;
}
.bet-type{
  font-size:11px;
  color:#475569;
  margin-top:2px;
}
.bet-right{text-align:right}
.bet-yen{
  font-size:12px;
  font-weight:900;
}
.odds{
  font-size:11px;
  color:#64748b;
}
.value{
  display:inline-block;
  margin-top:3px;
  font-size:10px;
  font-weight:800;
  padding:3px 6px;
  border-radius:6px;
  background:#f1f5f9;
}
.line-box{
  background:#f8fafc;
  border-radius:12px;
  padding:11px;
  font-size:13px;
  line-height:1.65;
}
.dev{
  font-size:13px;
  line-height:1.7;
  background:#f8fafc;
  border-radius:12px;
  padding:12px;
}
.rider-list{
  display:flex;
  flex-direction:column;
  gap:6px;
}
.rider{
  display:grid;
  grid-template-columns:38px 1fr auto;
  gap:9px;
  align-items:center;
  border:1px solid #e5e7eb;
  border-radius:11px;
  padding:8px;
  background:#fff;
}
.car{
  width:34px;
  height:34px;
  border-radius:7px;
  display:grid;
  place-items:center;
  font-weight:1000;
  background:#f1f5f9;
  color:#111827;
}
.car-1{background:#fff;color:#111;border:1px solid #111}
.car-2{background:#111;color:#fff}
.car-3{background:#ef4444;color:#fff}
.car-4{background:#2563eb;color:#fff}
.car-5{background:#facc15;color:#111}
.car-6{background:#111827;color:#fff}
.car-7{background:#f97316;color:#fff}
.rider-name{font-weight:900;font-size:13px}
.rider-info{font-size:10px;color:#64748b;margin-top:2px}
.rider-score{text-align:right}
.ai-score{font-weight:1000;font-size:16px}
.rider-finish{font-size:10px;color:#64748b}
.rank-mark{
  display:inline-block;
  font-weight:1000;
  margin-left:4px;
}
.result-box{
  border-radius:14px;
  padding:13px;
  margin-top:12px;
}
.result-pending{
  background:#f8fafc;
  border:1px solid #e2e8f0;
}
.result-finished{
  background:#ecfdf5;
  border:1px solid #bbf7d0;
}
.result-ticket{
  font-size:26px;
  font-weight:1000;
  letter-spacing:2px;
}
.payout{
  font-size:18px;
  font-weight:1000;
  color:#047857;
}
.settlement-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
  margin-top:10px;
}
.stat{
  background:#f8fafc;
  border-radius:10px;
  padding:9px 5px;
  text-align:center;
}
.stat-label{font-size:10px;color:#64748b}
.stat-value{font-size:15px;font-weight:1000;margin-top:2px}
.profit-hero{
  background:#111827;
  color:#fff;
  border-radius:18px;
  padding:17px;
  margin-bottom:12px;
}
.profit-title{
  font-size:13px;
  opacity:.75;
}
.profit-main{
  display:flex;
  justify-content:space-between;
  align-items:end;
  margin-top:5px;
}
.profit-number{
  font-size:34px;
  font-weight:1000;
}
.profit-sub{
  text-align:right;
  font-size:12px;
  line-height:1.6;
}
.plus{color:#22c55e}
.minus{color:#f87171}
.summary-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
}
.summary-stat{
  background:#f8fafc;
  border-radius:11px;
  padding:10px 4px;
  text-align:center;
}
.summary-label{font-size:10px;color:#64748b}
.summary-value{font-size:15px;font-weight:1000;margin-top:3px}
.table-wrap{
  overflow-x:auto;
}
.data-table{
  width:100%;
  border-collapse:collapse;
  font-size:11px;
  min-width:560px;
}
.data-table th{
  background:#f1f5f9;
  padding:8px 6px;
  text-align:center;
  font-weight:900;
}
.data-table td{
  border-bottom:1px solid #e5e7eb;
  padding:8px 5px;
  text-align:center;
}
.profit-plus{color:#16a34a;font-weight:1000}
.profit-minus{color:#dc2626;font-weight:1000}
.strategy{
  border:1px solid #e2e8f0;
  border-radius:12px;
  padding:10px;
  margin-bottom:7px;
}
.strategy-head{
  display:flex;
  justify-content:space-between;
  gap:8px;
  font-weight:900;
}
.strategy-stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:5px;
  margin-top:7px;
}
.strategy-stat{
  background:#f8fafc;
  border-radius:7px;
  padding:5px 2px;
  text-align:center;
  font-size:10px;
}
.strategy-stat b{display:block;font-size:12px}
.notice{
  padding:10px 12px;
  border-radius:11px;
  background:#eff6ff;
  color:#1e40af;
  font-size:11px;
  line-height:1.6;
}
.bottom-nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:100;
  height:72px;
  background:rgba(255,255,255,.96);
  backdrop-filter:blur(12px);
  border-top:1px solid #e5e7eb;
  display:grid;
  grid-template-columns:1fr 1fr;
  padding-bottom:env(safe-area-inset-bottom);
}
.nav-btn{
  border:0;
  background:none;
  color:#64748b;
  font-weight:900;
  font-size:12px;
}
.nav-icon{
  display:block;
  font-size:24px;
  line-height:27px;
}
.nav-btn.active{color:#2563eb}
.loading{
  padding:50px 10px;
  text-align:center;
  color:#64748b;
}
.error{
  background:#fff1f2;
  color:#be123c;
  padding:15px;
  border-radius:12px;
  line-height:1.6;
}
@media(max-width:600px){
  main{padding:9px 9px 25px}
  .card{border-radius:14px;padding:12px}
  .race-grid{grid-template-columns:repeat(6,1fr)}
  .settlement-grid{grid-template-columns:repeat(2,1fr)}
  .summary-grid{grid-template-columns:repeat(2,1fr)}
  .key-box{gap:5px}
  .key-num{font-size:22px}
  .ticket{font-size:18px}
}
</style>
</head>
<body>
<header class="header">
  <div class="header-inner">
    <div>
      <div class="title">🚴 競輪AI予想</div>
      <div class="date" id="headerDate">データ読み込み中…</div>
    </div>
    <div class="status" id="headerStatus">v6.11</div>
  </div>
</header>
<main>
<section id="predictionPage" class="page active">
  <div class="card">
    <div class="card-title">開催場</div>
    <div id="venues" class="venue-scroll"></div>
  </div>
  <div class="card">
    <div class="card-title">
      <span id="selectedVenueName">レース</span>
    </div>
    <div id="raceButtons" class="race-grid"></div>
  </div>
  <div id="predictionContent">
    <div class="loading">データを読み込んでいます…</div>
  </div>
</section>
<section id="profitPage" class="page">
  <div id="profitContent">
    <div class="loading">収支を計算しています…</div>
  </div>
</section>
</main>
<nav class="bottom-nav">
  <button class="nav-btn active" id="navPrediction" onclick="switchPage('prediction')">
    <span class="nav-icon">🏁</span>
    予想
  </button>
  <button class="nav-btn" id="navProfit" onclick="switchPage('profit')">
    <span class="nav-icon">💰</span>
    収支
  </button>
</nav>
<script>
const DATA_URL = "./data/today.json";
const BET_YEN_DEFAULT = 100;
let DATA = null;
let selectedVenue = null;
let selectedRace = null;
/* =========================
   基本
========================= */
const yen = n => {
  n = Number(n || 0);
  return n.toLocaleString("ja-JP") + "円";
};
const num = n => Number(n || 0);
const escapeHtml = str => {
  return String(str ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
};
function getRaces(){
  return Array.isArray(DATA?.races) ? DATA.races : [];
}
function getPrediction(race){
  return race?.frozen_prediction || {};
}
function getBets(race){
  const p = getPrediction(race);
  if(Array.isArray(p.bets)) return p.bets;
  if(Array.isArray(race?.bets)) return race.bets;
  return [];
}
function getRanking(race){
  const p = getPrediction(race);
  if(Array.isArray(p.ranking)) return p.ranking;
  if(Array.isArray(race?.ai?.ranking)) return race.ai.ranking;
  return [];
}
function getGrade(race){
  return String(
    race?.frozen_prediction?.verdict?.rank ||
    race?.verdict?.rank ||
    ""
  ).toUpperCase();
}
function isFinished(race){
  const r = race?.result;
  if(!r) return false;
  return r.finished === true ||
         r.result_finished === true ||
         Array.isArray(r.finish) && r.finish.length >= 3;
}
function getResultTicket(race){
  const r = race?.result;
  if(!r) return "";
  if(typeof r.payout_3tan === "string"){
    const m = r.payout_3tan.match(/[1-7]\s*[-－ー]\s*[1-7]\s*[-－ー]\s*[1-7]/);
    if(m) return m[0].replaceAll("－","-").replaceAll("ー","-").replaceAll(" ","");
  }
  if(Array.isArray(r.finish) && r.finish.length >= 3){
    return r.finish.slice(0,3).map(Number).join("-");
  }
  if(typeof r.finish === "string"){
    const m = r.finish.match(/[1-7]\s*[-－ー]\s*[1-7]\s*[-－ー]\s*[1-7]/);
    if(m) return m[0].replaceAll("－","-").replaceAll("ー","-").replaceAll(" ","");
  }
  return "";
}
function getPayout(race){
  const r = race?.result;
  if(!r) return 0;
  return num(
    r.payout_3tan_yen ??
    r.payout_3tan ??
    0
  );
}
function getBetYen(bet){
  return num(bet?.bet_yen || BET_YEN_DEFAULT);
}
function ticketHit(bet,race){
  const result = getResultTicket(race);
  return !!result && String(bet?.ticket) === result;
}
/* =========================
   起動
========================= */
async function loadData(){
  try{
    const response = await fetch(DATA_URL + "?t=" + Date.now(), {
      cache:"no-store"
    });
    if(!response.ok){
      throw new Error("today.jsonを取得できませんでした");
    }
    DATA = await response.json();
    if(!DATA || !Array.isArray(DATA.races)){
      throw new Error("today.jsonの形式が正しくありません");
    }
    document.getElementById("headerDate").textContent =
      `${DATA.target_date || ""}　全${DATA.races.length}R`;
    document.getElementById("headerStatus").textContent =
      `v${DATA.version || "6.11"}`;
    renderVenues();
    if(!selectedVenue){
      const venues = [...new Set(DATA.races.map(r => r.venue_name))];
      selectedVenue = venues[0] || "";
    }
    renderRaceButtons();
    const venueRaces = getRaces().filter(r => r.venue_name === selectedVenue);
    if(!selectedRace || !venueRaces.some(r => r.race_no === selectedRace.race_no)){
      selectedRace = venueRaces[0] || null;
    }
    renderRace();
    renderProfitPage();
  }catch(err){
    console.error(err);
    document.getElementById("predictionContent").innerHTML =
      `<div class="error">
        データの読み込みに失敗しました。<br>
        ${escapeHtml(err.message)}
      </div>`;
    document.getElementById("profitContent").innerHTML =
      `<div class="error">
        収支データを読み込めませんでした。
      </div>`;
  }
}
/* =========================
   ページ
========================= */
function switchPage(page){
  document.getElementById("predictionPage").classList.toggle(
    "active",page === "prediction"
  );
  document.getElementById("profitPage").classList.toggle(
    "active",page === "profit"
  );
  document.getElementById("navPrediction").classList.toggle(
    "active",page === "prediction"
  );
  document.getElementById("navProfit").classList.toggle(
    "active",page === "profit"
  );
  window.scrollTo({top:0,behavior:"smooth"});
}
/* =========================
   開催場
========================= */
function renderVenues(){
  const venues = [...new Set(getRaces().map(r => r.venue_name))];
  document.getElementById("venues").innerHTML =
    venues.map(v => `
      <button
        class="venue-btn ${v === selectedVenue ? "active":""}"
        onclick="selectVenue('${escapeHtml(v)}')">
        ${escapeHtml(v)}
      </button>
    `).join("");
}
function selectVenue(venue){
  selectedVenue = venue;
  const race = getRaces().find(r => r.venue_name === venue);
  selectedRace = race || null;
  renderVenues();
  renderRaceButtons();
  renderRace();
}
/* =========================
   レース選択
========================= */
function renderRaceButtons(){
  const races = getRaces().filter(
    r => r.venue_name === selectedVenue
  );
  document.getElementById("selectedVenueName").textContent =
    `${selectedVenue || ""}　${races.length}R`;
  document.getElementById("raceButtons").innerHTML =
    races.map(r => `
      <button
        class="race-btn ${selectedRace?.race_no === r.race_no ? "active":""} ${isFinished(r) ? "finished":""}"
        onclick="selectRace(${r.race_no})">
        ${r.race_no}R
      </button>
    `).join("");
}
function selectRace(no){
  selectedRace = getRaces().find(
    r => r.venue_name === selectedVenue && Number(r.race_no) === Number(no)
  );
  renderRaceButtons();
  renderRace();
}
/* =========================
   予想画面
========================= */
function renderRace(){
  if(!selectedRace){
    document.getElementById("predictionContent").innerHTML =
      `<div class="loading">レースがありません。</div>`;
    return;
  }
  const r = selectedRace;
  const p = getPrediction(r);
  const v = p.verdict || r.verdict || {};
  const grade = getGrade(r);
  document.getElementById("predictionContent").innerHTML = `
    <div class="card">
      <div class="race-head">
        <div>
          <div class="race-name">${escapeHtml(r.venue_name)} ${r.race_no}R</div>
          <div class="race-meta">
            ${isFinished(r) ? "✅ 結果確定" : "⏳ 結果待ち"}
          </div>
        </div>
        <div class="grade grade-${grade || "C"}">
          ${grade || "－"}ランク
        </div>
      </div>
      <div class="key-box">
        <div class="key-item">
          <div class="key-label">本命</div>
          <div class="key-num main-num">${p.main ?? "－"}</div>
        </div>
        <div class="key-item">
          <div class="key-label">対抗</div>
          <div class="key-num opp-num">${p.opponent ?? "－"}</div>
        </div>
        <div class="key-item">
          <div class="key-label">穴</div>
          <div class="key-num dark-num">${p.dark_horse ?? "－"}</div>
        </div>
      </div>
      <div class="verdict ${grade}">
        <div class="verdict-top">
          <div class="verdict-label">
            ${escapeHtml(v.label || "AI判定")}
          </div>
          <div class="verdict-score">
            ${v.score != null ? `AI ${v.score}点` : ""}
          </div>
        </div>
        <div class="small" style="margin-top:5px">
          ${escapeHtml(v.reason || "")}
        </div>
      </div>
    </div>
    ${renderBets(r)}
    ${renderResult(r)}
    ${renderDevelopment(r)}
    ${renderLine(r)}
    ${renderRanking(r)}
    ${renderRiders(r)}
  `;
}
/* =========================
   AI買い目
========================= */
function renderBets(race){
  const bets = getBets(race);
  if(!bets.length) return "";
  return `
    <div class="card">
      <div class="card-title">
        🎯 AIおすすめ買い目
        <span class="small">　${bets.length}点・各100円</span>
      </div>
      <div class="notice" style="margin-bottom:9px">
        凍結済みAI予想の買い目をそのまま表示しています。
        収支計算もこの買い目を基準にしています。
      </div>
      <div class="bet-list">
        ${bets.map((b,i) => `
          <div class="bet">

/* =========================
   収支計算
========================= */
function calculateProfit(){
  const races = getRaces();
  let investment = 0;
  let payout = 0;
  let hits = 0;
  let settled = 0;
  const raceRows = [];
  const venueMap = {};
  const gradeMap = {
    S:{races:0,investment:0,payout:0,profit:0,hits:0},
    A:{races:0,investment:0,payout:0,profit:0,hits:0},
    B:{races:0,investment:0,payout:0,profit:0,hits:0},
    C:{races:0,investment:0,payout:0,profit:0,hits:0}
  };
  races.forEach(race => {
    if(!isFinished(race)) return;
    const bets = getBets(race);
    const raceInvestment =
      bets.reduce((sum,b) => sum + getBetYen(b),0);
    const resultTicket = getResultTicket(race);
    const resultPayout = getPayout(race);
    const hitBet = bets.find(
      b => String(b.ticket) === String(resultTicket)
    );
    const racePayout = hitBet ? resultPayout : 0;
    const raceProfit = racePayout - raceInvestment;
    investment += raceInvestment;
    payout += racePayout;
    if(hitBet) hits++;
    settled++;
    const venue = race.venue_name || "その他";
    if(!venueMap[venue]){
      venueMap[venue] = {
        venue,
        races:0,
        investment:0,
        payout:0,
        profit:0,
        hits:0
      };
    }
    venueMap[venue].races++;
    venueMap[venue].investment += raceInvestment;
    venueMap[venue].payout += racePayout;
    venueMap[venue].profit += raceProfit;
    if(hitBet) venueMap[venue].hits++;
    const grade = getGrade(race) || "C";
    if(gradeMap[grade]){
      gradeMap[grade].races++;
      gradeMap[grade].investment += raceInvestment;
      gradeMap[grade].payout += racePayout;
      gradeMap[grade].profit += raceProfit;
      if(hitBet) gradeMap[grade].hits++;
    }
    raceRows.push({
      venue,
      race_no:race.race_no,
      grade,
      ticket:resultTicket,
      hit:!!hitBet,
      hitTicket:hitBet?.ticket || "",
      investment:raceInvestment,
      payout:racePayout,
      profit:raceProfit
    });
  });
  return {
    investment,
    payout,
    profit:payout-investment,
    hits,
    settled,
    hitRate: settled ? hits/settled*100 : 0,
    roi: investment ? payout/investment*100 : 0,
    raceRows,
    venueRows:Object.values(venueMap),
    gradeRows:gradeMap
  };
}
