<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>KEIRIN AI</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f3f6fa;
      color: #172033;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        "Yu Gothic",
        "Hiragino Kaku Gothic ProN",
        Arial,
        sans-serif;
    }

    button,
    select,
    input {
      font: inherit;
    }

    /* =========================
       ヘッダー
    ========================= */

    .header {
      background: linear-gradient(
        135deg,
        #0b4ea2,
        #1677d2
      );

      color: white;
      padding:
        calc(18px + env(safe-area-inset-top))
        18px
        18px;

      box-shadow:
        0 4px 15px rgba(0,0,0,0.15);

      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-inner {
      max-width: 900px;
      margin: 0 auto;
    }

    .logo {
      font-size: 27px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .subtitle {
      margin-top: 4px;
      font-size: 12px;
      opacity: 0.9;
    }

    /* =========================
       全体
    ========================= */

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 16px;
      padding-bottom: 40px;
    }

    /* =========================
       更新情報
    ========================= */

    .update-card {
      background: white;
      border-radius: 16px;
      padding: 14px 16px;
      margin-bottom: 16px;

      box-shadow:
        0 3px 12px rgba(20,40,70,0.08);

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .update-label {
      font-size: 12px;
      color: #7b8494;
    }

    .update-date {
      font-size: 16px;
      font-weight: 800;
      margin-top: 2px;
    }

    .status {
      background: #e9f9ef;
      color: #168344;
      border-radius: 999px;
      padding: 7px 11px;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    /* =========================
       セクションタイトル
    ========================= */

    .section-title {
      font-size: 19px;
      font-weight: 900;
      margin: 22px 2px 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-title::before {
      content: "";
      width: 5px;
      height: 21px;
      border-radius: 4px;
      background: #1677d2;
    }

    /* =========================
       開催場
    ========================= */

    .venue-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .venue-button {
      border: none;
      background: white;
      border-radius: 15px;
      padding: 16px 12px;
      text-align: left;
      cursor: pointer;

      box-shadow:
        0 3px 12px rgba(20,40,70,0.08);

      transition: 0.15s;
    }

    .venue-button:active {
      transform: scale(0.97);
    }

    .venue-button.active {
      background:
        linear-gradient(
          135deg,
          #1267bd,
          #1e83e5
        );

      color: white;

      box-shadow:
        0 6px 18px rgba(22,119,210,0.28);
    }

    .venue-name {
      font-size: 18px;
      font-weight: 900;
    }

    .venue-count {
      font-size: 12px;
      margin-top: 5px;
      opacity: 0.7;
    }

    .venue-button.active
    .venue-count {
      opacity: 0.9;
    }

    /* =========================
       レース選択
    ========================= */

    .race-area {
      margin-top: 18px;
    }

    .race-grid {
      display: grid;
      grid-template-columns:
        repeat(3, 1fr);

      gap: 8px;
    }

    .race-button {
      border: 0;
      background: white;
      border-radius: 13px;
      padding: 13px 5px;

      box-shadow:
        0 2px 9px rgba(20,40,70,0.07);

      cursor: pointer;
    }

    .race-button:active {
      transform: scale(0.96);
    }

    .race-number {
      font-size: 17px;
      font-weight: 900;
    }

    .race-time {
      font-size: 11px;
      color: #687386;
      margin-top: 3px;
    }

    .race-button.active {
      background: #172033;
      color: white;
    }

    .race-button.active
    .race-time {
      color: #dce5f0;
    }

    /* =========================
       選択中レース
    ========================= */

    .race-header {
      margin-top: 22px;

      background:
        linear-gradient(
          135deg,
          #172033,
          #29374d
        );

      color: white;
      border-radius: 18px;

      padding: 18px;

      box-shadow:
        0 6px 20px rgba(20,30,50,0.18);
    }

    .race-header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .race-title {
      font-size: 25px;
      font-weight: 900;
    }

    .start-time {
      background: #fff;
      color: #172033;
      border-radius: 10px;
      padding: 8px 10px;
      font-weight: 900;
      font-size: 14px;
      white-space: nowrap;
    }

    .race-info {
      margin-top: 8px;
      font-size: 12px;
      opacity: 0.8;
    }

    /* =========================
       選手カード
    ========================= */

    .riders {
      margin-top: 12px;
      display: grid;
      gap: 9px;
    }

    .rider-card {
      background: white;
      border-radius: 15px;

      padding: 12px;

      display: flex;
      align-items: center;

      gap: 12px;

      box-shadow:
        0 3px 11px rgba(20,40,70,0.08);
    }

    .car-number {
      width: 43px;
      height: 43px;

      flex: 0 0 43px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 9px;

      color: #111;
      font-size: 20px;
      font-weight: 900;
    }

    /* 車番カラー */

    .car-1 {
      background: #ffffff;
      border: 2px solid #d8dce2;
    }

    .car-2 {
      background: #222;
      color: white;
    }

    .car-3 {
      background: #f04444;
      color: white;
    }

    .car-4 {
      background: #2878d1;
      color: white;
    }

    .car-5 {
      background: #f5df22;
    }

    .car-6 {
      background: #28a765;
      color: white;
    }

    .car-7 {
      background: #ed7d24;
      color: white;
    }

    .rider-main {
      min-width: 0;
      flex: 1;
    }

    .rider-name {
      font-size: 17px;
      font-weight: 900;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .rider-meta {
      margin-top: 4px;

      font-size: 12px;
      color: #70798a;
    }

    .rider-arrow {
      color: #a4acb8;
      font-size: 20px;
    }

    /* =========================
       AI予想エリア
    ========================= */

    .ai-box {
      margin-top: 20px;

      background:
        linear-gradient(
          135deg,
          #fff4f4,
          #fff
        );

      border:
        2px solid #ff5a5a;

      border-radius: 18px;

      padding: 17px;

      box-shadow:
        0 5px 18px rgba(230,60,60,0.08);
    }

    .ai-title {
      display: flex;
      align-items: center;
      gap: 8px;

      font-size: 20px;
      font-weight: 900;

      color: #d62f2f;
    }

    .ai-badge {
      background: #e33b3b;
      color: white;

      border-radius: 7px;

      padding: 4px 7px;

      font-size: 10px;
      font-weight: 900;
    }

    .ai-message {
      margin-top: 10px;

      color: #737b89;

      font-size: 13px;
      line-height: 1.6;
    }

    /* =========================
       予想ボタン
    ========================= */

    .ai-button {
      width: 100%;

      margin-top: 13px;

      border: none;

      background:
        linear-gradient(
          135deg,
          #e52f2f,
          #ff5757
        );

      color: white;

      border-radius: 13px;

      padding: 14px;

      font-size: 16px;
      font-weight: 900;

      cursor: pointer;

      box-shadow:
        0 5px 13px rgba(220,50,50,0.22);
    }

    .ai-button:active {
      transform: scale(0.98);
    }

    /* =========================
       初期画面
    ========================= */

    .empty {
      background: white;

      border-radius: 16px;

      padding: 30px 18px;

      text-align: center;

      color: #7c8594;

      box-shadow:
        0 3px 12px rgba(20,40,70,0.07);
    }

    .empty-icon {
      font-size: 38px;
      margin-bottom: 10px;
    }

    .loading {
      text-align: center;
      padding: 50px 10px;
      color: #778193;
    }

    .error {
      background: #fff0f0;
      border: 1px solid #ffb4b4;
      color: #b22d2d;

      border-radius: 14px;

      padding: 16px;

      line-height: 1.6;
    }

    /* =========================
       PC
    ========================= */

    @media (min-width: 700px) {

      .venue-grid {
        grid-template-columns:
          repeat(4, 1fr);
      }

      .race-grid {
        grid-template-columns:
          repeat(6, 1fr);
      }

      .riders {
        grid-template-columns:
          repeat(2, 1fr);
      }

    }

  </style>
</head>


<body>

  <!-- =========================
       ヘッダー
  ========================= -->

  <header class="header">

    <div class="header-inner">

      <div class="logo">
        🚴 KEIRIN AI
      </div>

      <div class="subtitle">
        今日の競輪をAIで分析
      </div>

    </div>

  </header>


  <main class="container">

    <!-- =========================
         更新情報
    ========================= -->

    <div class="update-card">

      <div>
        <div class="update-label">
          データ更新日
        </div>

        <div
          class="update-date"
          id="updateDate"
        >
          読み込み中...
        </div>
      </div>

      <div class="status">
        ● 最新データ
      </div>

    </div>


    <!-- =========================
         開催場
    ========================= -->

    <div class="section-title">
      今日の開催
    </div>

    <div
      id="venueGrid"
      class="venue-grid"
    >
      <div class="loading">
        開催情報を読み込んでいます...
      </div>
    </div>


    <!-- =========================
         レース
    ========================= -->

    <div
      id="raceArea"
      class="race-area"
      style="display:none;"
    >

      <div class="section-title">
        レースを選択
      </div>

      <div
        id="raceGrid"
        class="race-grid"
      ></div>

    </div>


    <!-- =========================
         レース詳細
    ========================= -->

    <div
      id="raceDetail"
      style="display:none;"
    >

      <div
        id="raceHeader"
        class="race-header"
      ></div>

      <div
        id="riders"
        class="riders"
      ></div>


      <!-- =====================
           AI予想
      ====================== -->

      <div class="ai-box">

        <div class="ai-title">

          <span class="ai-badge">
            AI
          </span>

          3連単予想

        </div>

        <div class="ai-message">
          このレースの選手データをもとに、
          AIが買い目を分析します。
        </div>

        <button
          class="ai-button"
          onclick="showComingSoon()"
        >
          🔥 AI予想を見る
        </button>

      </div>

    </div>


  </main>


<script>

  let appData = null;

  let selectedVenue = null;

  let selectedRace = null;


  /* =========================
     データ読み込み
  ========================= */

  async function loadData() {

    try {

      const response =
        await fetch(
          "data/today.json?time="
          + Date.now()
        );

      if (!response.ok) {

        throw new Error(
          "データを取得できませんでした"
        );

      }

      appData =
        await response.json();

      initialize();

    } catch (error) {

      console.error(error);

      document.getElementById(
        "venueGrid"
      ).innerHTML = `

        <div class="error">

          ❌ データを読み込めませんでした。

          <br><br>

          GitHub Actionsで
          <strong>
            Update Keirin Data
          </strong>
          が正常終了しているか確認してください。

        </div>

      `;

    }

  }


  /* =========================
     初期化
  ========================= */

  function initialize() {

    if (!appData) {
      return;
    }

    document.getElementById(
      "updateDate"
    ).textContent =
      appData.date || "本日";

    renderVenues();

  }


  /* =========================
     開催場表示
  ========================= */

  function renderVenues() {

    const grid =
      document.getElementById(
        "venueGrid"
      );

    grid.innerHTML = "";

    if (
      !appData.venues ||
      appData.venues.length === 0
    ) {

      grid.innerHTML = `

        <div class="empty">

          <div class="empty-icon">
            🚴
          </div>

          本日の開催はありません。

        </div>

      `;

      return;

    }


    appData.venues.forEach(
      (venue, index) => {

        const button =
          document.createElement(
            "button"
          );

        button.className =
          "venue-button";

        button.innerHTML = `

          <div class="venue-name">
            ${escapeHtml(venue.name)}
          </div>

          <div class="venue-count">
            ${venue.races.length}レース
          </div>

        `;

        button.onclick = () => {

          selectVenue(
            index,
            button
          );

        };

        grid.appendChild(
          button
        );

      }
    );

  }


  /* =========================
     開催場選
