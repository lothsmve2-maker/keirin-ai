<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>競輪AI予想</title>
<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}
html, body {
  margin: 0;
  padding: 0;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    Meiryo,
    sans-serif;
  background: #f3f5f8;
  color: #172033;
}
body {
  padding-bottom: calc(78px + env(safe-area-inset-bottom));
}
button,
select {
  font: inherit;
}
button {
  cursor: pointer;
}
#app {
  width: 100%;
  max-width: 1100px;
  margin: 0 auto;
}
/* =========================
   HEADER
========================= */
.header {
  position: sticky;
  top: 0;
  z-index: 50;
  background: linear-gradient(135deg, #0f172a, #1e3a8a);
  color: #fff;
  padding: 15px 15px 14px;
  box-shadow: 0 3px 12px rgba(15, 23, 42, .18);
}
.header-inner {
  max-width: 1100px;
  margin: 0 auto;
}
.header-title {
  font-size: 21px;
  font-weight: 900;
  letter-spacing: .02em;
}
.header-sub {
  margin-top: 4px;
  font-size: 11px;
  opacity: .78;
}
/* =========================
   PAGE
========================= */
.page {
  display: none;
  padding: 12px;
}
.page.active {
  display: block;
}
/* =========================
   COMMON
========================= */
.card {
  background: #fff;
  border-radius: 16px;
  padding: 14px;
  margin-bottom: 12px;
  box-shadow: 0 2px 10px rgba(15, 23, 42, .07);
  border: 1px solid #e7ebf1;
}
.card-title {
  font-size: 15px;
  font-weight: 900;
  margin-bottom: 10px;
}
.muted {
  color: #718096;
  font-size: 12px;
}
.small {
  font-size: 11px;
}
.empty {
  padding: 28px 12px;
  text-align: center;
  color: #718096;
}
.loading {
  padding: 50px 15px;
  text-align: center;
  color: #64748b;
}
.error {
  margin: 14px;
  padding: 16px;
  border-radius: 14px;
  background: #fff1f2;
  border: 1px solid #fecdd3;
  color: #be123c;
}
/* =========================
   VENUE
========================= */
.venue-scroll {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 4px;
  scrollbar-width: none;
}
.venue-scroll::-webkit-scrollbar {
  display: none;
}
.venue-btn {
  flex: 0 0 auto;
  border: 1px solid #d8dee8;
  background: #fff;
  color: #334155;
  border-radius: 999px;
  padding: 9px 14px;
  font-weight: 800;
  font-size: 13px;
}
.venue-btn.active {
  background: #1d4ed8;
  border-color: #1d4ed8;
  color: #fff;
}
/* =========================
   RACE BUTTONS
========================= */
.race-scroll {
  display: flex;
  gap: 7px;
  overflow-x: auto;
  scrollbar-width: none;
}
.race-scroll::-webkit-scrollbar {
  display: none;
}
.race-btn {
  flex: 0 0 auto;
  min-width: 46px;
  border: 1px solid #d8dee8;
  background: #fff;
  border-radius: 10px;
  padding: 9px 10px;
  font-weight: 900;
  color: #334155;
}
.race-btn.active {
  background: #0f172a;
  color: #fff;
  border-color: #0f172a;
}
/* =========================
   RACE HEADER
========================= */
.race-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 10px;
}
.race-name {
  font-size: 19px;
  font-weight: 900;
}
.race-meta {
  color: #64748b;
  font-size: 11px;
  margin-top: 4px;
}
.grade {
  flex: 0 0 auto;
  border-radius: 8px;
  padding: 6px 9px;
  background: #eef2ff;
  color: #3730a3;
  font-size: 12px;
  font-weight: 900;
}
/* =========================
   VERDICT
========================= */
.verdict {
  border-radius: 14px;
  padding: 14px;
  color: #fff;
  background: linear-gradient(135deg, #172554, #1d4ed8);
}
.verdict-label {
  font-size: 11px;
  opacity: .8;
}
.verdict-main {
  font-size: 23px;
  font-weight: 1000;
  margin-top: 3px;
}
.verdict-sub {
  font-size: 12px;
  margin-top: 4px;
  opacity: .9;
}
/* =========================
   AI CARD
========================= */
.ai-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 7px;
}
.ai-item {
  text-align: center;
  border-radius: 11px;
  padding: 9px 4px;
  background: #f8fafc;
}
.ai-rank {
  font-size: 10px;
  color: #64748b;
}
.ai-number {
  font-size: 23px;
  font-weight: 1000;
  margin-top: 2px;
}
.ai-score {
  font-size: 10px;
  color: #64748b;
}
/* =========================
   RIDER NUMBER COLORS
========================= */
.car {
  display: inline-flex;
  justify-content: center;
  align-items: center;
  width: 28px;
  height: 28px;
  border-radius: 7px;
  font-size: 13px;
  font-weight: 1000;
  margin-right: 5px;
}
.car-1 {
  background: #fff;
  color: #111827;
  border: 1px solid #cbd5e1;
}
.car-2 {
  background: #111827;
  color: #fff;
}
.car-3 {
  background: #dc2626;
  color: #fff;
}
.car-4 {
  background: #2563eb;
  color: #fff;
}
.car-5 {
  background: #facc15;
  color: #111827;
}
.car-6 {
  background: #16a34a;
  color: #fff;
}
/* 7番車は必ずオレンジ */
.car-7 {
  background: #f97316 !important;
  color: #fff !important;
}
.car-8 {
  background: #111827;
  color: #fff;
}
.car-9 {
  background: #7c3aed;
  color: #fff;
}
/* =========================
   BETS
========================= */
.bet-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.bet {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px;
  border-radius: 12px;
  background: #f8fafc;
  border: 1px solid #e2e8f0;
}
.bet-hit {
  background: #ecfdf5;
  border-color: #86efac;
}
.bet-rank {
  width: 27px;
  height: 27px;
  flex: 0 0 27px;
  display: flex;
  justify-content: center;
  align-items: center;
  border-radius: 50%;
  background: #e2e8f0;
  font-size: 11px;
  font-weight: 900;
}
.bet-name {
  flex: 1;
  min-width: 0;
}
.bet-label {
  font-size: 11px;
  color: #64748b;
  margin-bottom: 3px;
}
.bet-number {
  font-size: 16px;
  font-weight: 1000;
  letter-spacing: .05em;
}
.bet-cost {
  font-size: 11px;
  color: #64748b;
  white-space: nowrap;
}
/* =========================
   LINE
========================= */
.line-box {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
}
.line {
  padding: 7px 10px;
  border-radius: 9px;
  background: #eff6ff;
  color: #1e40af;
  font-size: 12px;
  font-weight: 900;
}
/* =========================
   DEVELOPMENT
========================= */
.development {
  padding: 12px;
  border-radius: 12px;
  background: #f8fafc;
  line-height: 1.7;
  font-size: 13px;
}
/* =========================
   RIDERS
========================= */
.rider-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.rider {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 9px;
  background: #f8fafc;
  border-radius: 11px;
}
.rider-main {
  flex: 1;
  min-width: 0;
}
.rider-name {
  font-size: 13px;
  font-weight: 900;
}
.rider-info {
  color: #64748b;
  font-size: 10px;
  margin-top: 2px;
}
.rider-score {
  font-size: 13px;
  font-weight: 900;
}
/* =========================
   PROFIT
========================= */
.profit-total {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
}
.metric {
  padding: 12px;
  border-radius: 12px;
  background: #f8fafc;
}
.metric-label {
  color: #64748b;
  font-size: 10px;
}
.metric-value {
  font-size: 20px;
  font-weight: 1000;
  margin-top: 2px;
}
.profit-positive {
  color: #059669;
}
.profit-negative {
  color: #dc2626;
}
.metric-wide {
  grid-column: span 2;
}
/* =========================
   PROFIT TABLE
========================= */
.table-wrap {
  overflow-x: auto;
}
.profit-table {
  width: 100%;
  min-width: 650px;
  border-collapse: collapse;
  font-size: 11px;
}
.profit-table th {
  background: #f1f5f9;
  color: #475569;
  font-weight: 900;
}
.profit-table th,
.profit-table td {
  padding: 8px 6px;
  border-bottom: 1px solid #e2e8f0;
  text-align: right;
  white-space: nowrap;
}
.profit-table th:first-child,
.profit-table td:first-child {
  text-align: left;
}
.hit {
  color: #059669;
  font-weight: 1000;
}
.miss {
  color: #94a3b8;
}
.unsettled {
  color: #d97706;
  font-weight: 900;
}
/* =========================
   SUMMARY BADGE
========================= */
.summary-badge {
  display: inline-block;
  padding: 4px 7px;
  border-radius: 7px;
  background: #eff6ff;
  color: #1d4ed8;
  font-size: 10px;
  font-weight: 900;
}
/* =========================
   BOTTOM NAV
========================= */
.bottom-nav {
  position: fixed;
  z-index: 100;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(255,255,255,.96);
  backdrop-filter: blur(12px);
  border-top: 1px solid #e2e8f0;
  padding: 7px 10px calc(7px + env(safe-area-inset-bottom));
}
.bottom-nav-inner {
  max-width: 700px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
}
.nav-btn {
  border: 0;
  background: transparent;
  color: #64748b;
  padding: 7px;
  border-radius: 12px;
  font-weight: 900;
}
.nav-btn.active {
  background: #eff6ff;
  color: #1d4ed8;
}
.nav-icon {
  font-size: 19px;
  display: block;
}
.nav-label {
  display: block;
  font-size: 10px;
  margin-top: 1px;
}
/* =========================
   DESKTOP
========================= */
@media (min-width: 700px) {
  .page {
    padding: 18px;
  }
  .profit-total {
    grid-template-columns: repeat(4, 1fr);
  }
  .metric-wide {
    grid-column: auto;
  }
  .ai-grid {
    grid-template-columns: repeat(4, 1fr);
  }
}
</style>
</head>
<body>
<header class="header">
  <div class="header-inner">
    <div class="header-title">🚴 競輪AI予想</div>
    <div class="header-sub" id="headerSub">AI DATA LOADING...</div>
  </div>
</header>
<div id="app">
  <!-- =========================
       PREDICTION PAGE
  ========================== -->
  <main id="predictionPage" class="page active">
<section class="card">
  <div class="card-title">開催場</div>
  <div id="venueButtons" class="venue-scroll"></div>
</section>
<section class="card">
  <div class="card-title" id="selectedVenueTitle">レース選択</div>
  <div id="raceButtons" class="race-scroll"></div>
</section>
<div id="predictionContent"></div>
  </main>
  <!-- =========================
       PROFIT PAGE
  ========================== -->
  <main id="profitPage" class="page">
<section class="card">
  <div class="card-title">💰 AI買い目収支</div>
  <div class="muted">
    AIが選択した買い目を1点100円で購入した場合の自動集計
  </div>
</section>
<div id="profitContent"></div>
  </main>
</div>
<nav class="bottom-nav">
  <div class="bottom-nav-inner">
<button id="navPrediction"
        class="nav-btn active"
        onclick="switchPage('prediction')">
  <span class="nav-icon">🏁</span>
  <span class="nav-label">予想</span>
</button>
<button id="navProfit"
        class="nav-btn"
        onclick="switchPage('profit')">
  <span class="nav-icon">💰</span>
  <span class="nav-label">収支</span>
</button>
  </div>
</nav>
<script>
"use strict";
/* =========================================================
   GLOBAL
========================================================= */
let DATA = null;
let selectedVenueIndex = 0;
let selectedRaceIndex = 0;
let currentPage = "prediction";
const BET_UNIT = 100;
const $ = id => document.getElementById(id);
function num(v, fallback = 0) {
  const n = Number(v);
  return Number.isFinite(n) ? n : fallback;
}
function str(v, fallback = "") {
  if (v === null || v === undefined) return fallback;
  return String(v);
}
function arr(v) {
  return Array.isArray(v) ? v : [];
}
function escapeHtml(value) {
  return str(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}
/* =========================================================
   DATA HELPERS
========================================================= */
function getRaces() {
  return arr(DATA?.races);
}
function getVenues() {
  const races = getRaces();
  const map = new Map();
  races.forEach(race => {
    const name =
      race.venue_name ??
      race.venue ??
      race.place ??
      race.keirin_venue ??
      "不明";
    if (!map.has(name)) {
      map.set(name, []);
    }
    map.get(name).push(race);
  });
  return [...map.entries()].map(([name, races]) => ({
    name,
    races
  }));
}
function getCurrentVenue() {
  return getVenues()[selectedVenueIndex] || null;
}
function getCurrentRace() {
  const venue = getCurrentVenue();
  return venue?.races?.[selectedRaceIndex] || null;
}
function getRaceNumber(race) {
  return num(
    race?.race_number ??
    race?.race_no ??
    race?.r ?? 
    race?.number ??
    0
  );
}
function getGrade(race) {
  return str(
    race?.grade ??
    race?.class ??
    race?.race_grade ??
    race?.grade_name ??
    ""
  );
}
function getRiders(race) {
  return arr(
    race?.riders ??
    race?.entries ??
    race?.players ??
    race?.members
  );
}
function getCarNumber(rider) {
  return num(
    rider?.car_number ??
    rider?.car ??
    rider?.number ??
    rider?.frame ??
    0
  );
}
function getRiderName(rider) {
  return str(
    rider?.name ??
    rider?.rider_name ??
    rider?.player_name ??
    rider?.full_name ??
    "選手"
  );
}
function getAIScore(rider) {
  return num(
    rider?.ai_score ??
    rider?.score ??
    rider?.prediction_score ??
    rider?.ai ??
    0
  );
}
/* =========================================================
   LOAD
========================================================= */
async function loadData() {
  try {
    const response = await fetch(
      "./data/today.json?t=" + Date.now(),
      { cache: "no-store" }
    );
    if (!response.ok) {
      throw new Error("today.json の取得に失敗しました");
    }
    DATA = await response.json();
    if (!Array.isArray(DATA?.races)) {
      throw new Error("today.json に races がありません");
    }
    const date =
      DATA.date ??
      DATA.target_date ??
      DATA.race_date ??
      "";
    $("headerSub").textContent =
      date ? `対象日：${date}` : "本日のAI予想";
    renderVenues();
  } catch (error) {
    console.error(error);
    $("predictionContent").innerHTML = `
      <div class="error">
        <strong>データ読み込みエラー</strong><br>
        ${escapeHtml(error.message)}
      </div>
    `;
  }
}
/* =========================================================
   NAV
========================================================= */
function switchPage(page) {
  currentPage = page;
  $("predictionPage").classList.toggle(
    "active",
    page === "prediction"
  );
  $("profitPage").classList.toggle(
    "active",
    page === "profit"
  );
  $("navPrediction").classList.toggle(
    "active",
    page === "prediction"
  );
  $("navProfit").classList.toggle(
    "active",
    page === "profit"
  );
  if (page === "profit") {
    renderProfitPage();
  }
}
/* =========================================================
   VENUES
========================================================= */
function renderVenues() {
  const venues = getVenues();
  if (!venues.length) {
    $("venueButtons").innerHTML =
      `<div class="empty">開催データがありません</div>`;
    return;
  }
  if (selectedVenueIndex >= venues.length) {
    selectedVenueIndex = 0;
  }
  $("venueButtons").innerHTML = venues
    .map((venue, index) => `
      <button
        class="venue-btn ${index === selectedVenueIndex ? "active" : ""}"
        onclick="selectVenue(${index})">
        ${escapeHtml(venue.name)}
      </button>
    `)
    .join("");
  renderRaceButtons();
}
function selectVenue(index) {
  selectedVenueIndex = index;
  selectedRaceIndex = 0;
  renderVenues();
  renderPrediction();
}
function renderRaceButtons() {
  const venue = getCurrentVenue();
  if (!venue) return;
  $("selectedVenueTitle").textContent =
    `${venue.name}　${venue.races.length}R`;
  $("raceButtons").innerHTML = venue.races
    .map((race, index) => {
      const r = getRaceNumber(race);
      return `
        <button
          class="race-btn ${index === selectedRaceIndex ? "active" : ""}"
          onclick="selectRace(${index})">
          ${r ? r + "R" : (index + 1) + "R"}
        </button>
      `;
    })
    .join("");
}
function selectRace(index) {
  selectedRaceIndex = index;
  renderRaceButtons();
  renderPrediction();
}
/* =========================================================
   PREDICTION
========================================================= */
function renderPrediction() {
  const race = getCurrentRace();
  if (!race) {
    $("predictionContent").innerHTML =
      `<div class="empty">レースデータがありません</div>`;
    return;
  }
  $("predictionContent").innerHTML = `
    ${renderRaceHeader(race)}
    ${renderVerdict(race)}
    ${renderAICard(race)}
    ${renderBets(race)}
    ${renderLine(race)}
    ${renderDevelopment(race)}
    ${renderRanking(race)}
  `;
}
function renderRaceHeader(race) {
  const venue =
    race.venue_name ??
    race.venue ??
    race.place ??
    "";
  const raceNo = getRaceNumber(race);
  const grade = getGrade(race);
  return `
    <section class="card">
      <div class="race-header">
        <div>
          <div class="race-name">
            ${escapeHtml(venue)}
            ${raceNo ? raceNo + "R" : ""}
          </div>
          <div class="race-meta">
            ${escapeHtml(
              race.race_name ??
              race.title ??
              race.name ??
              ""
            )}
          </div>
        </div>
        ${grade
          ? `<div class="grade">${escapeHtml(grade)}</div>`
          : ""}
      </div>
    </section>
  `;
}
/* =========================================================
   VERDICT
========================================================= */
function calculateVerdict(race) {
  const riders = getRiders(race)
    .slice()
    .sort((a, b) => getAIScore(b) - getAIScore(a));
  const main = riders[0];
  const second = riders[1];
  const third = riders[2];
  if (!main) {
    return {
      main: "—",
      sub: "AI予想データなし"
    };
  }
  const mainNo = getCarNumber(main);
  const secondNo = getCarNumber(second);
  const thirdNo = getCarNumber(third);
  return {
    main: mainNo ? `${mainNo}番` : getRiderName(main),
    sub:
      `対抗 ${secondNo || "—"}番　穴 ${thirdNo || "—"}番`
  };
}
function renderVerdict(race) {
  const verdict = calculateVerdict(race);
  return `
    <section class="card">
      <div class="verdict">
        <div class="verdict-label">AI総合判断</div>
        <div class="verdict-main">
          ◎ ${escapeHtml(verdict.main)}
        </div>
        <div class="verdict-sub">
          ${escapeHtml(verdict.sub)}
        </div>
      </div>
    </section>
  `;
}
/* =========================================================
   AI CARD
========================================================= */
function renderAICard(race) {
  const riders = getRiders(race)
    .slice()
    .sort((a, b) => getAIScore(b) - getAIScore(a))
    .slice(0, 4);
  return `
    <section class="card">
      <div class="card-title">🤖 AI評価</div>
      <div class="ai-grid">
        ${riders.map((rider, index) => {
          const car = getCarNumber(rider);
          return `
            <div class="ai-item">
              <div class="ai-rank">
                ${["本命","対抗","穴","注"][index] || "評価"}
              </div>
              <div class="ai-number">
                <span class="car car-${car}">
                  ${car || "?"}
                </span>
              </div>
              <div class="ai-score">
                ${getAIScore(rider).toFixed(1)}
              </div>
            </div>
          `;
        }).join("")}
      </div>
    </section>
  `;
}
/* =========================================================
   BET GENERATOR
========================================================= */
function generateBets(race) {
  const riders = getRiders(race)
    .slice()
    .sort((a, b) => getAIScore(b) - getAIScore(a));
  if (riders.length < 3) {
    return [];
  }
  const numbers = riders
    .map(getCarNumber)
    .filter(Boolean);
  const line = getLineGroups(race);
  const bets = [];
  const used = new Set();
  function add(label, a, b, c, score = 0) {
    if (!a || !b || !c) return;
    if (a === b || a === c || b === c) return;
    const key = `${a}-${b}-${c}`;
    if (used.has(key)) return;
    used.add(key);
    bets.push({
      label,
      numbers: [a, b, c],
      score
    });
  }
  const n = numbers;
  /*
   * 基本AI買い目
   */
  if (n.length >= 3) {
    add(
      "🔥 AI本線",
      n[0],
      n[1],
      n[2],
      100
    );
  }
  if (n.length >= 4) {
    add(
      "🔥 本線入替",
      n[1],
      n[0],
      n[2],
      95
    );
    add(
      "⭐ 対抗頭",
      n[1],
      n[2],
      n[0],
      90
    );
    add(
      "🎯 穴絡み",
      n[0],
      n[1],
      n[3],
      86
    );
    add(
      "🎯 穴入替",
      n[0],
      n[3],
      n[1],
      84
    );
    add(
      "💥 逆転",
      n[2],
      n[0],
      n[1],
      82
    );
    add(
      "💥 対抗展開",
      n[2],
      n[1],
      n[0],
      80
    );
  }
  if (n.length >= 5) {
    add(
      "🎯 中穴",
      n[0],
      n[2],
      n[4],
      76
    );
    add(
      "💥 高配当",
      n[3],
      n[0],
      n[1],
      72
    );
    add(
      "💣 大穴警戒",
      n[3],
      n[1],
      n[4],
      68
    );
    add(
      "💣 穴頭",
      n[4],
      n[0],
      n[1],
      64
    );
  }
  /*
   * ラインを考慮した追加
   */
  if (line.length) {
    line.forEach((group, gi) => {
      const g = group.filter(n => numbers.includes(n));
      if (g.length >= 2) {
        const other = numbers.find(x => !g.includes(x));
        if (other) {
          add(
            `ライン${gi + 1}展開`,
            g[0],
            g[1],
            other,
            60 - gi
          );
          add(
            `ライン${gi + 1}逆転`,
            g[1],
            g[0],
            other,
            58 - gi
          );
        }
      }
    });
  }
  return bets
    .sort((a, b) => b.score - a.score)
    .slice(0, 10);
}

function getLineGroups(race) {
  const raw =
    race?.line ??
    race?.lines ??
    race?.line_groups ??
    race?.formation ??
    [];
  if (Array.isArray(raw)) {
    if (raw.every(x => Array.isArray(x))) {
      return raw.map(x =>
        x.map(Number).filter(Boolean)
      );
    }
    if (raw.every(x => typeof x === "object")) {
      return raw.map(group => {
        const members =
          group.members ??
          group.cars ??
          group.riders ??
          group.numbers ??
          [];
        return arr(members)
          .map(x =>
            typeof x === "object"
              ? getCarNumber(x)
              : num(x)
          )
          .filter(Boolean);
      });
    }
    return [raw.map(Number).filter(Boolean)];
  }
  if (typeof raw === "string") {
    return raw
      .split(/[\/｜|、,\s]+/)
      .map(part =>
        part
          .split(/[-→:>]/)
          .map(Number)
          .filter(Boolean)
      )
      .filter(group => group.length);
  }
  return [];
}
function renderLine(race) {

/* =========================================================
   RESULT DETECTION
========================================================= */
function getRaceResult(race) {
  /*
   * v6系で考えられる着順フィールドを幅広く吸収
   */
  const candidates = [
    race?.result,
    race?.results,
    race?.finish,
    race?.finishes,
    race?.race_result,
    race?.arrival,
    race?.order,
    race?.ranking,
    race?.着順
  ];
  for (const candidate of candidates) {
    if (Array.isArray(candidate)) {
      const nums = candidate
        .map(x => {
          if (typeof x === "object") {
            return num(
              x.car_number ??
              x.car ??
              x.number ??
              x.position_number ??
              x.着
            );
          }
          return num(x);
        })
        .filter(Boolean);
      if (nums.length >= 3) {
        return nums.slice(0, 3);
      }
    }
    if (typeof candidate === "object" && candidate) {
      const arr1 = [
        candidate.first,
        candidate.second,
        candidate.third
      ]
        .map(num)
        .filter(Boolean);
      if (arr1.length >= 3) {
        return arr1.slice(0, 3);
      }
      const arr2 = [
        candidate["1"],
        candidate["2"],
        candidate["3"]
      ]
        .map(num)
        .filter(Boolean);
      if (arr2.length >= 3) {
        return arr2.slice(0, 3);
      }
    }
    if (typeof candidate === "string") {
      const nums = candidate
        .split(/[→\-－=／\/,\s]+/)
        .map(num)
        .filter(Boolean);
      if (nums.length >= 3) {
        return nums.slice(0, 3);
      }
    }
  }
  /*
   * race直下のfinish_1〜
   */
  const direct = [
    race?.finish_1,
    race?.finish_2,
    race?.finish_3
  ]
    .map(num)
    .filter(Boolean);
  if (direct.length >= 3) {
    return direct.slice(0, 3);
  }
  /*
   * riderにfinish_positionがあるケース
   */
  const riderResults = getRiders(race)
    .map(rider => ({
      car: getCarNumber(rider),
      pos: num(
        rider?.finish_position ??
        rider?.finish ??
        rider?.arrival ??
        rider?.rank ??
        rider?.着順
      )
    }))
    .filter(x => x.car && x.pos);
  if (riderResults.length >= 3) {
    riderResults.sort((a, b) => a.pos - b.pos);
    return riderResults
      .slice(0, 3)
      .map(x => x.car);
  }
  return null;
}
/* =========================================================
   BET HIT
========================================================= */
function isWinningBet(bet, result) {
  if (!result || result.length < 3) {
    return false;
  }
  return (
    bet.numbers[0] === result[0] &&
    bet.numbers[1] === result[1] &&
    bet.numbers[2] === result[2]
  );
}
/* =========================================================
   PAYOUT
========================================================= */
function normalizePayout(value) {
  if (value === null || value === undefined) {
    return null;
  }
  if (typeof value === "number") {
    return value > 0 ? value : null;
  }
  const cleaned = String(value)
    .replace(/,/g, "")
    .replace(/[円¥]/g, "")
    .trim();
  const n = Number(cleaned);
  return n > 0 ? n : null;
}
function findPayoutInObject(obj) {
  if (!obj || typeof obj !== "object") {
    return null;
  }
  const directKeys = [
    "payout",
    "payouts",
    "return",
    "returns",
    "refund",
    "refunds",
    "dividend",
    "dividends",
    "pay",
    "amount",
    "払戻",
    "払戻金",
    "配当",
    "配当金"
  ];
  for (const key of directKeys) {
    const value = obj[key];
    if (typeof value === "number" || typeof value === "string") {
      const p = normalizePayout(value);
      if (p !== null) return p;
    }
  }
  const nestedKeys = [
    "3tan",
    "trifecta",
    "exacta",
    "sanrentan",
    "triple",
    "result",
    "results",
    "payout"
  ];
  for (const key of nestedKeys) {
    const value = obj[key];
    if (Array.isArray(value)) {
      for (const item of value) {
        const p = findPayoutInObject(item);
        if (p !== null) return p;
      }
    }
    if (value && typeof value === "object") {
      const p = findPayoutInObject(value);
      if (p !== null) return p;
    }
  }
  return null;
}
function getPayoutForBet(race, bet) {
  /*
   * まずレース全体から払戻を探す
   */
  const containers = [
    race?.payouts,
    race?.refunds,
    race?.returns,
    race?.dividends,
    race?.payoffs,
    race?.result
  ];
  for (const container of containers) {
    if (Array.isArray(container)) {
      for (const item of container) {
        if (!item || typeof item !== "object") {
          continue;
        }
        const combination = str(
          item.combination ??
          item.combo ??
          item.numbers ??
          item.number ??
          item.bet ??
          item["組合せ"] ??
          ""
        )
          .replace(/\s/g, "")
          .replace(/→/g, "-")
          .replace(/＞/g, "-")
          .replace(/－/g, "-")
          .replace(/＝/g, "-");
        const target = bet.numbers.join("-");
        if (
          combination === target ||
          combination.includes(target)
        ) {
          const payout = findPayoutInObject(item);
          if (payout !== null) {
            return payout;
          }
        }
      }
    }
  }
  /*
   * race直下
   */
  return findPayoutInObject(race);
}
/* =========================================================
   GRADE
========================================================= */
function getRaceGrade(race) {
  const grade = str(
    race?.grade ??
    race?.class ??
    race?.race_grade ??
    race?.grade_name ??
    ""
  ).toUpperCase();
  if (/S/.test(grade)) return "S";
  if (/A/.test(grade)) return "A";
  if (/B/.test(grade)) return "B";
  if (/C/.test(grade)) return "C";
  return grade || "その他";
}
/* =========================================================
   TODAY PROFIT CALC
========================================================= */
function calculateTodayProfit() {
  const races = getRaces();
  let investment = 0;
  let payout = 0;
  let hits = 0;
  let settled = 0;
  let unsettled = 0;
  const raceRows = [];
  const gradeMap = {};
  races.forEach((race, raceIndex) => {
    const bets = generateBets(race);
    if (!bets.length) {
      return;
    }
    const result = getRaceResult(race);
    const settledRace =
      Array.isArray(result) &&
      result.length >= 3;
    const raceInvestment =
      bets.length * BET_UNIT;
    let racePayout = 0;
    let raceHit = false;
    if (settledRace) {
      settled++;
      bets.forEach(bet => {
        if (isWinningBet(bet, result)) {
          raceHit = true;
          hits++;
          const p = getPayoutForBet(race, bet);
          if (p !== null) {
            racePayout += p;
          }
        }
      });
    } else {
      unsettled++;
    }
    if (settledRace) {
      investment += raceInvestment;
      payout += racePayout;
    }
    const grade = getRaceGrade(race);
    if (!gradeMap[grade]) {
      gradeMap[grade] = {
        grade,
        races: 0,
        hits: 0,
        investment: 0,
        payout: 0
      };
    }
    if (settledRace) {
      gradeMap[grade].races++;
      gradeMap[grade].investment += raceInvestment;
      gradeMap[grade].payout += racePayout;
      if (raceHit) {
        gradeMap[grade].hits++;
      }
    }
    raceRows.push({
      race,
      raceIndex,
      bets,
      result,
      settled: settledRace,
      investment: raceInvestment,
      payout: racePayout,
      hit: raceHit,
      profit: racePayout - raceInvestment
    });
  });
  return {
    investment,
    payout,
    profit: payout - investment,
    hits,
    settled,
    unsettled,
    hitRate:
      settled > 0
        ? hits / settled * 100
        : 0,
    roi:
      investment > 0
        ? payout / investment * 100
        : 0,
    raceRows,
    grades: Object.values(gradeMap)
  };
}

                <th>投資</th>
                <th>払戻</th>
                <th>収支</th>
              </tr>
            </thead>
            <tbody>
              ${DATA.daily_cap_backtests
                .slice(0, 20)
                .map(item => {
                  const investment =
                    num(
                      item.investment ??
                      item.total_investment ??
                      item.bet_total
                    );
                  const payout =
                    num(
                      item.payout ??
                      item.total_payout ??
                      item.return_total
                    );
                  const profit =
                    num(
                      item.profit ??
                      item.balance ??
                      payout - investment
                    );
                  return `
                    <tr>
                      <td>
                        ${escapeHtml(
                          item.strategy ??
                          item.name ??
                          "戦略"
                        )}
                      </td>
                      <td>
                        ¥${investment.toLocaleString()}
                      </td>
                      <td>
                        ¥${payout.toLocaleString()}
                      </td>
                      <td class="${
                        profit >= 0
                          ? "profit-positive"
                          : "profit-negative"
                      }">
                        ${profit >= 0 ? "+" : ""}
                        ¥${profit.toLocaleString()}
                      </td>
                    </tr>
                  `;
                })
                .join("")}
            </tbody>
          </table>
        </div>
      </section>
    `);
  }
  if (Array.isArray(DATA?.backtests)) {
    sections.push(`
      <section class="card">
        <div class="card-title">
          🧪 バックテスト
        </div>
        <div class="table-wrap">
          <table class="profit-table">
            <thead>
              <tr>
                <th>戦略</th>
                <th>R</th>
                <th>的中</th>
                <th>投資</th>
                <th>払戻</th>
                <th>回収率</th>
              </tr>
            </thead>
            <tbody>
              ${DATA.backtests
                .slice(0, 30)
                .map(item => {
                  const investment =
                    num(
                      item.investment ??
                      item.total_investment ??
                      item.bet_total
                    );
                  const payout =
                    num(
                      item.payout ??
                      item.total_payout ??
                      item.return_total
                    );
                  const races =
                    num(
                      item.races ??
                      item.finished_races ??
                      item.settled_races
                    );
                  const hits =
                    num(
                      item.hits ??
                      item.hit_races ??
                      item.wins
                    );
                  const roi =
                    investment > 0
                      ? payout / investment * 100
                      : num(
                        item.roi ??
                        item.return_rate ??
                        item.recovery_rate
                      );
                  return `
                    <tr>
                      <td>
                        ${escapeHtml(
                          item.strategy ??
                          item.name ??
                          "戦略"
                        )}
                      </td>
                      <td>${races}</td>
                      <td>${hits}</td>
                      <td>
                        ¥${investment.toLocaleString()}
                      </td>
                      <td>
                        ¥${payout.toLocaleString()}
                      </td>
                      <td>
                        ${roi.toFixed(1)}%
                      </td>
                    </tr>
                  `;
                })
                .join("")}
            </tbody>
          </table>
        </div>
      </section>
    `);
  }
  return sections.join("");
}

  loadData();
});
