<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>競輪AI予想</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f3f5f8;
  color: #17202a;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    Meiryo,
    sans-serif;
}

header {
  background: linear-gradient(135deg, #111827, #1f2937);
  color: white;
  padding: 22px 16px 20px;
  position: sticky;
  top: 0;
  z-index: 50;
  box-shadow: 0 3px 12px rgba(0,0,0,.18);
}

.header-inner {
  max-width: 900px;
  margin: auto;
}

.title {
  font-size: 24px;
  font-weight: 800;
  letter-spacing: .5px;
}

.subtitle {
  margin-top: 5px;
  font-size: 12px;
  opacity: .72;
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 14px 12px 50px;
}

/* 開催場 */

.section-title {
  font-size: 18px;
  font-weight: 800;
  margin: 10px 2px;
}

.venue-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 9px;
}

.venue-card {
  background: white;
  border-radius: 14px;
  padding: 14px;
  border: 2px solid transparent;
  box-shadow: 0 2px 8px rgba(0,0,0,.07);
  cursor: pointer;
  transition: .15s;
}

.venue-card:active {
  transform: scale(.98);
}

.venue-card.active {
  border-color: #2563eb;
  background: #eff6ff;
}

.venue-name {
  font-size: 17px;
  font-weight: 800;
}

.venue-count {
  margin-top: 4px;
  color: #6b7280;
  font-size: 12px;
}

/* レース */

.race-list {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-top: 10px;
}

.race-btn {
  border: 0;
  background: white;
  border-radius: 12px;
  padding: 12px 5px;
  font-weight: 800;
  box-shadow: 0 2px 7px rgba(0,0,0,.07);
  cursor: pointer;
  color: #1f2937;
}

.race-btn.active {
  background: #2563eb;
  color: white;
}

.race-btn .race-number {
  font-size: 17px;
}

.race-btn .race-info {
  display: block;
  font-size: 10px;
  margin-top: 3px;
  opacity: .7;
}

/* メイン */

.race-panel {
  margin-top: 16px;
}

.race-header {
  background: white;
  border-radius: 16px;
  padding: 16px;
  box-shadow: 0 2px 9px rgba(0,0,0,.08);
}

.race-title {
  font-size: 22px;
  font-weight: 900;
}

.race-meta {
  margin-top: 4px;
  font-size: 12px;
  color: #6b7280;
}

/* AI */

.ai-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-top: 12px;
}

.ai-card {
  background: white;
  border-radius: 15px;
  padding: 13px 8px;
  text-align: center;
  box-shadow: 0 2px 8px rgba(0,0,0,.08);
}

.ai-label {
  font-size: 11px;
  font-weight: 800;
  margin-bottom: 6px;
}

.ai-car {
  font-size: 30px;
  font-weight: 900;
  line-height: 1;
}

.ai-name {
  font-size: 12px;
  font-weight: 800;
  margin-top: 5px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.ai-score {
  margin-top: 5px;
  font-size: 11px;
  color: #6b7280;
}

.main-card {
  border-top: 5px solid #dc2626;
}

.opponent-card {
  border-top: 5px solid #2563eb;
}

.dark-card {
  border-top: 5px solid #7c3aed;
}

/* セクション */

.info-card {
  background: white;
  border-radius: 16px;
  margin-top: 12px;
  padding: 15px;
  box-shadow: 0 2px 8px rgba(0,0,0,.07);
}

.info-title {
  font-size: 16px;
  font-weight: 900;
  margin-bottom: 11px;
}

/* 並び */

.line-display {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
}

.line-group {
  display: flex;
  gap: 3px;
  align-items: center;
  padding: 7px 8px;
  background: #f3f4f6;
  border-radius: 10px;
}

.line-car {
  width: 30px;
  height: 30px;
  border-radius: 7px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 900;
  color: white;
  font-size: 14px;
}

.arrow {
  color: #6b7280;
  font-weight: 900;
}

/* 車番色 */

.car-1 { background:#ffffff; color:#111827; border:1px solid #bbb; }
.car-2 { background:#111827; }
.car-3 { background:#dc2626; }
.car-4 { background:#2563eb; }
.car-5 { background:#facc15; color:#111827; }
.car-6 { background:#16a34a; }
.car-7 { background:#111827; }

/* 選手 */

.rider {
  border: 1px solid #e5e7eb;
  border-radius: 13px;
  margin-top: 9px;
  padding: 11px;
  background: #fff;
}

.rider-top {
  display: flex;
  align-items: center;
  gap: 9px;
}

.rider-car {
  width: 36px;
  height: 36px;
  flex: 0 0 36px;
  border-radius: 8px;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 17px;
  font-weight: 900;
}

.rider-name {
  font-size: 15px;
  font-weight: 900;
  flex: 1;
}

.mark {
  min-width: 31px;
  height: 31px;
  border-radius: 50%;
  display: flex;
  justify-content: center;
  align-items: center;
  font-weight: 900;
  font-size: 15px;
}

.mark-main {
  background: #fee2e2;
  color: #dc2626;
}

.mark-second {
  background: #dbeafe;
  color: #2563eb;
}

.mark-third {
  background: #ede9fe;
  color: #7c3aed;
}

.mark-other {
  background: #f3f4f6;
  color: #6b7280;
}

.rider-meta {
  margin-top: 5px;
  font-size: 11px;
  color: #6b7280;
}

.rider-comment {
  margin-top: 8px;
  font-size: 13px;
  line-height: 1.55;
  background: #f8fafc;
  border-radius: 8px;
  padding: 8px;
}

.score-box {
  display: flex;
  gap: 6px;
  margin-top: 8px;
}

.score {
  background: #f1f5f9;
  padding: 5px 8px;
  border-radius: 7px;
  font-size: 11px;
  font-weight: 700;
}

/* 展開 */

.development {
  background: #fff7ed;
  border-left: 4px solid #f97316;
  border-radius: 8px;
  padding: 11px;
  font-size: 13px;
  line-height: 1.65;
}

/* 更新情報 */

.status {
  margin-top: 12px;
  text-align: center;
  font-size: 11px;
  color: #6b7280;
}

/* 読み込み */

.loading {
  text-align: center;
  padding: 50px 10px;
  color: #6b7280;
}

.error {
  background: #fee2e2;
  color: #991b1b;
  border-radius: 12px;
  padding: 15px;
  margin-top: 15px;
  line-height: 1.6;
}

/* PC */

@media (min-width: 700px) {
  .venue-grid {
    grid-template-columns: repeat(4, 1fr);
  }

  .race-list {
    grid-template-columns: repeat(6, 1fr);
  }
}

/* スマホ */

@media (max-width: 430px) {
  .container {
    padding-left: 10px;
    padding-right: 10px;
  }

  .title {
    font-size: 22px;
  }

  .ai-car {
    font-size: 26px;
  }

  .ai-name {
    font-size: 11px;
  }

  .race-list {
    grid-template-columns: repeat(4, 1fr);
  }
}
</style>
</head>

<body>

<header>
  <div class="header-inner">
    <div class="title">🏇 競輪AI予想</div>
    <div class="subtitle">
      今日のレースをAIデータから分析
    </div>
  </div>
</header>

<main class="container">

  <div id="loading" class="loading">
    データを読み込んでいます…
  </div>

  <div id="app" style="display:none;">

    <div class="section-title">🏟 開催場</div>
    <div id="venues" class="venue-grid"></div>

    <div class="section-title" style="margin-top:18px;">
      🏁 レース
    </div>

    <div id="races" class="race-list"></div>

    <div id="racePanel" class="race-panel"></div>

    <div id="status" class="status"></div>

  </div>

  <div id="error" style="display:none;"></div>

</main>

<script>

let DATA = null;
let selectedVenue = null;
let selectedRace = null;

const DATA_URL = "./data/today.json";

async function loadData() {

  try {

    const response = await fetch(DATA_URL + "?t=" + Date.now());

    if (!response.ok) {
      throw new Error("today.json を取得できませんでした");
    }

    DATA = await response.json();

    if (!DATA.races || !DATA.races.length) {
      throw new Error("レースデータがありません");
    }

    document.getElementById("loading").style.display = "none";
    document.getElementById("app").style.display = "block";

    renderVenues();

    const firstVenue =
      DATA.venues && DATA.venues.length
        ? DATA.venues[0].venue_code
        : DATA.races[0].venue_code;

    selectVenue(firstVenue);

    document.getElementById("status").textContent =
      `${DATA.target_date || ""} / ${DATA.race_count || DATA.races.length}レース / ${DATA.rider_count || 0}選手`;

  } catch (error) {

    document.getElementById("loading").style.display = "none";

    const box = document.getElementById("error");

    box.style.display = "block";
    box.className = "error";
    box.innerHTML =
      "⚠️ データの読み込みに失敗しました。<br><br>" +
      escapeHtml(error.message) +
      "<br><br>GitHub Actionsでデータ更新が完了しているか確認してください。";
  }
}

/* -------------------------
   開催場
------------------------- */

function renderVenues() {

  const container = document.getElementById("venues");
  container.innerHTML = "";

  DATA.venues.forEach(venue => {

    const div = document.createElement("div");

    div.className = "venue-card";
    div.dataset.code = venue.venue_code;

    div.innerHTML = `
      <div class="venue-name">
        ${escapeHtml(venue.venue_name)}
      </div>
      <div class="venue-count">
        ${venue.race_count}レース
      </div>
    `;

    div.onclick = () => selectVenue(venue.venue_code);

    container.appendChild(div);
  });
}

function selectVenue(code) {

  selectedVenue = String(code);

  document.querySelectorAll(".venue-card").forEach(card => {
    card.classList.toggle(
      "active",
      String(card.dataset.code) === selectedVenue
    );
  });

  const races = DATA.races.filter(
    r => String(r.venue_code) === selectedVenue
  );

  renderRaceButtons(races);

  if (races.length) {
    selectRace(races[0]);
  }
}

/* -------------------------
   レースボタン
------------------------- */

function renderRaceButtons(races) {

  const container = document.getElementById("races");
  container.innerHTML = "";

  races
    .sort((a,b) => a.race_no - b.race_no)
    .forEach(race => {

      const button = document.createElement("button");

      button.className = "race-btn";

      button.dataset.race =
        `${race.venue_code}-${race.race_no}`;

      button.innerHTML = `
        <span class="race-number">${race.race_no}R</span>
        <span class="race-info">
          ${race.riders.length}車
        </span>
      `;

      button.onclick = () => selectRace(race);

      container.appendChild(button);
    });
}

function selectRace(race) {

  selectedRace = race;

  document.querySelectorAll(".race-btn").forEach(btn => {

    btn.classList.toggle(
      "active",
      btn.dataset.race ===
      `${race.venue_code}-${race.race_no}`
    );

  });

  renderRace(race);

  window.scrollTo({
    top: document.getElementById("racePanel").offsetTop - 80,
    behavior: "smooth"
  });
}

/* -------------------------
   レース表示
------------------------- */

function renderRace(race) {

  const panel = document.getElementById("racePanel");

  const ai = race.ai || {};

  const ranking = ai.ranking || [];

  const main =
    findRider(race, ai.main);

  const opponent =
    findRider(race, ai.opponent);

  const dark =
    findRider(race, ai.dark_horse);

  panel.innerHTML = `

    <div class="race-header">

      <div class="race-title">
        ${escapeHtml(race.venue_name)}
        ${race.race_no}R
      </div>

      <div class="race-meta">
        ${race.riders.length}車立て
        ${race.prediction_url ? " / AI予想データ取得済み" : ""}
      </div>

    </div>

    <div class="ai-grid">

      ${renderAICard(
        "🔥 本命",
        main,
        "main-card"
      )}

      ${renderAICard(
        "⭐ 対抗",
        opponent,
        "opponent-card"
      )}

      ${renderAICard(
        "💥 穴",
        dark,
        "dark-card"
      )}

    </div>

    ${renderLine(race)}

    ${renderDevelopment(race)}

    ${renderRiders(race, ranking)}

  `;
}

/* -------------------------
   AIカード
------------------------- */

function renderAICard(label, rider, className) {

  if (!rider) {

    return `
      <div class="ai-card ${className}">
        <div class="ai-label">${label}</div>
        <div class="ai-car">-</div>
        <div class="ai-name">---</div>
      </div>
    `;
  }

  return `
    <div class="ai-card ${className}">

      <div class="ai-label">
        ${label}
      </div>

      <div class="ai-car">
        ${rider.car_no}番
      </div>

      <div class="ai-name">
        ${escapeHtml(rider.name)}
      </div>

      <div class="ai-score">
        AI ${formatScore(rider.ai_score)}点
      </div>

    </div>
  `;
}

/* -------------------------
   並び
------------------------- */

function renderLine(race) {

  const groups = race.line_groups || [];

  let content = "";

  if (groups.length) {

    content = groups.map(group => {

      return `
        <div class="line-group">

          ${group.map((car, index) => `

            ${index > 0
              ? `<span class="arrow">→</span>`
              : ""
            }

            <div class="line-car car-${car}">
              ${car}
            </div>

          `).join("")}

        </div>
      `;

    }).join("");

  } else if (race.line && race.line.length) {

    content = `
      <div class="line-group">

        ${race.line.map((car, index) => `

          ${index > 0
            ? `<span class="arrow">→</span>`
            : ""
          }

          <div class="line-car car-${car}">
            ${car}
          </div>

        `).join("")}

      </div>
    `;

  } else {

    content = "並び情報なし";

  }

  return `
    <div class="info-card">

      <div class="info-title">
        🚴 予想ライン
      </div>

      <div class="line-display">
        ${content}
      </div>

    </div>
  `;
}

/* -------------------------
   展開
------------------------- */

function renderDevelopment(race) {

  if (!race.development) {
    return "";
  }

  return `
    <div class="info-card">

      <div class="info-title">
        🧠 展開予想
      </div>

      <div class="development">
        ${escapeHtml(race.development)}
      </div>

    </div>
  `;
}

/* -------------------------
   選手
------------------------- */

function renderRiders(race, ranking) {

  const riders =
    [...race.riders].sort(
      (a,b) => (b.ai_score || 0) - (a.ai_score || 0)
    );

  return `
    <div class="info-card">

      <div class="info-title">
        👤 AI選手評価
      </div>

      ${riders.map((rider, index) =>
        renderRider(rider, index)
      ).join("")}

    </div>
  `;
}

function renderRider(rider, index) {

  let markClass = "mark-other";

  if (index === 0) {
    markClass = "mark-main";
  } else if (index === 1) {
    markClass = "mark-second";
  } else if (index === 2) {
    markClass = "mark-third";
  }

  const mark =
    rider.prediction_mark ||
    ["◎","○","▲"][index] ||
    "";

  const finish =
    [
      rider.finish_1,
      rider.finish_2,
      rider.finish_3,
      rider.finish_out
    ]
    .filter(v => v !== null && v !== undefined)
    .join("-");

  return `
    <div class="rider">

      <div class="rider-top">

        <div class="rider-car car-${rider.car_no}">
          ${rider.car_no}
        </div>

        <div class="rider-name">
          ${escapeHtml(rider.name)}
        </div>

        <div class="mark ${markClass}">
          ${escapeHtml(mark)}
        </div>

      </div>

      <div class="rider-meta">

        ${rider.age ? rider.age + "歳" : ""}
        ${rider.period ? " / " + rider.period + "期" : ""}
        ${rider.prefecture ? " / " + escapeHtml(rider.prefecture) : ""}
        ${rider.grade ? " / " + escapeHtml(rider.grade) : ""}
        ${rider.style ? " / " + escapeHtml(rider.style) : ""}

      </div>

      <div class="score-box">

        <span class="score">
          AI ${formatScore(rider.ai_score)}
        </span>

        ${
          rider.score != null
          ? `<span class="score">競走得点 ${rider.score}</span>`
          : ""
        }

        ${
          finish
          ? `<span class="score">着順 ${finish}</span>`
          : ""
        }

      </div>

      ${
        rider.comment
        ? `
          <div class="rider-comment">
            💬 ${escapeHtml(rider.comment)}
          </div>
        `
        : ""
      }

    </div>
  `;
}

/* -------------------------
   共通
------------------------- */

function findRider(race, carNo) {

  if (
    carNo === null ||
    carNo === undefined
  ) {
    return null;
  }

  return race.riders.find(
    r => Number(r.car_no) === Number(carNo)
  ) || null;
}

function formatScore(value) {

  if (
    value === null ||
    value === undefined ||
    isNaN(value)
  ) {
    return "-";
  }

  return Number(value).toFixed(1);
}

function escapeHtml(value) {

  if (value === null || value === undefined) {
    return "";
  }

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

loadData();

</script>

</body>
</html>
