<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>競輪AI予想</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f5f8;color:#17202a;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;padding-bottom:82px}
button{font:inherit;cursor:pointer}
.header{position:sticky;top:0;z-index:50;background:linear-gradient(135deg,#111827,#1f2937);color:#fff;box-shadow:0 3px 12px rgba(0,0,0,.18)}
.header-inner{max-width:980px;margin:auto;padding:15px 12px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.title{font-size:22px;font-weight:1000}
.date{font-size:11px;opacity:.72;margin-top:3px}
.status{font-size:11px;opacity:.75}
main{max-width:980px;margin:auto;padding:10px 10px 30px}
.page{display:none}
.page.active{display:block}
.card{background:#fff;border-radius:16px;padding:13px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,.07)}
.card-title{font-size:16px;font-weight:1000;margin-bottom:9px}
.small{font-size:11px;color:#64748b;line-height:1.6}
.venue-scroll{display:flex;gap:7px;overflow-x:auto;padding-bottom:2px}
.venue-btn{border:1px solid #e2e8f0;background:#fff;border-radius:999px;padding:8px 13px;font-weight:900;white-space:nowrap}
.venue-btn.active{background:#2563eb;color:#fff;border-color:#2563eb}
.race-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.race-btn{border:0;background:#f8fafc;border-radius:10px;padding:9px 3px;font-weight:1000;color:#334155}
.race-btn.active{background:#2563eb;color:#fff}
.race-btn.settled{box-shadow:inset 0 -3px #16a34a}
.race-btn.confirmed{box-shadow:inset 0 -3px #f59e0b}
.race-btn.invalid{box-shadow:inset 0 -3px #ef4444}
.race-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.race-name{font-size:22px;font-weight:1000}
.race-meta{font-size:11px;color:#64748b;margin-top:3px}
.grade{padding:7px 9px;border-radius:9px;font-weight:1000;white-space:nowrap}
.grade-S{background:#fee2e2;color:#991b1b}
.grade-A{background:#ffedd5;color:#9a3412}
.grade-B{background:#dbeafe;color:#1d4ed8}
.grade-C{background:#e5e7eb;color:#4b5563}
.key-box{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}
.key-item{text-align:center;background:#f8fafc;border-radius:12px;padding:9px}
.key-label{font-size:10px;color:#64748b;font-weight:900}
.key-num{font-size:25px;font-weight:1000;margin-top:2px}
.main-num{color:#dc2626}
.opp-num{color:#2563eb}
.dark-num{color:#ea580c}
.verdict{margin-top:10px;border-radius:13px;padding:11px;color:#fff}
.verdict.S{background:linear-gradient(135deg,#991b1b,#dc2626)}
.verdict.A{background:linear-gradient(135deg,#c2410c,#f97316)}
.verdict.B{background:linear-gradient(135deg,#1d4ed8,#2563eb)}
.verdict.C{background:linear-gradient(135deg,#4b5563,#6b7280)}
.verdict-top{display:flex;justify-content:space-between;gap:8px}
.verdict-label,.verdict-score{font-weight:1000}
.bet-list{display:grid;gap:7px}
.bet{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;border:1px solid #e2e8f0;border-radius:11px;padding:8px}
.bet.main{border:2px solid #ef4444;background:#fff7f7}
.bet-no{width:27px;height:27px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#f1f5f9;font-size:11px;font-weight:1000}
.bet.main .bet-no{background:#dc2626;color:#fff}
.ticket{font-size:18px;font-weight:1000;letter-spacing:1px}
.bet-type{font-size:10px;color:#64748b;margin-top:2px}
.bet-right{text-align:right}
.bet-yen{font-size:11px;font-weight:900}
.odds{font-size:12px;font-weight:1000;color:#2563eb;margin-top:2px}
.odds.missing{color:#94a3b8}
.expected{font-size:10px;color:#64748b;margin-top:1px}
.value{font-size:9px;color:#64748b;margin-top:2px}
.result-box{border-radius:14px;padding:12px;margin-top:8px}
.result-pre{background:#f8fafc;border:1px solid #e2e8f0}
.result-confirmed{background:#eff6ff;border:1px solid #bfdbfe}
.result-settled{background:#ecfdf5;border:1px solid #bbf7d0}
.result-error{background:#fff7ed;border:1px solid #fed7aa}
.result-ticket{font-size:27px;font-weight:1000;letter-spacing:2px}
.payout{font-size:19px;font-weight:1000;color:#047857;margin-top:3px}
.settlement-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:9px}
.stat{background:rgba(255,255,255,.75);border-radius:9px;padding:8px 4px;text-align:center}
.stat-label{font-size:9px;color:#64748b}
.stat-value{font-size:14px;font-weight:1000;margin-top:2px}
.profit-plus{color:#16a34a;font-weight:1000}
.profit-minus{color:#dc2626;font-weight:1000}
.dev{background:#fff7ed;border-left:4px solid #f97316;border-radius:8px;padding:10px;font-size:12px;line-height:1.65}
.line-box{display:flex;flex-wrap:wrap;gap:6px}
.line-group{background:#f8fafc;border-radius:9px;padding:7px;font-size:11px}
.rider-list{display:grid;gap:6px}
.rider{display:grid;grid-template-columns:37px 1fr auto;gap:8px;align-items:center;border:1px solid #e5e7eb;border-radius:12px;padding:8px}
.car{width:37px;height:37px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:1000}
.car-1{background:#fff;color:#111827;border:1px solid #94a3b8}
.car-2{background:#111827;color:#fff}
.car-3{background:#dc2626;color:#fff}
.car-4{background:#2563eb;color:#fff}
.car-5{background:#facc15;color:#111827}
.car-6{background:#16a34a;color:#fff}
.car-7{background:#f97316;color:#fff}
.rider-name{font-weight:1000;font-size:13px}
.rider-info{font-size:10px;color:#64748b;margin-top:2px}
.rider-score{text-align:right}
.ai-score{font-weight:1000;font-size:15px}
.rider-finish{font-size:10px;color:#64748b}
.profit-hero{background:#111827;color:#fff;border-radius:18px;padding:16px;margin-bottom:10px}
.profit-title{font-size:12px;opacity:.72}
.profit-main{display:flex;justify-content:space-between;align-items:end;margin-top:4px}
.profit-number{font-size:34px;font-weight:1000}
.plus{color:#22c55e}
.minus{color:#f87171}
.profit-sub{text-align:right;font-size:11px;line-height:1.6}
.summary-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.summary-stat{background:#f8fafc;border-radius:10px;padding:9px 4px;text-align:center}
.summary-label{font-size:9px;color:#64748b}
.summary-value{font-size:14px;font-weight:1000;margin-top:2px}
.data-table{width:100%;border-collapse:collapse;font-size:11px;min-width:560px}
.table-wrap{overflow-x:auto}
.data-table th{background:#f1f5f9;padding:7px 5px}
.data-table td{border-bottom:1px solid #e5e7eb;padding:7px 5px;text-align:center}
.strategy{border:1px solid #e2e8f0;border-radius:11px;padding:9px;margin-bottom:6px}
.strategy-head{display:flex;justify-content:space-between;gap:8px;font-weight:900}
.strategy-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:6px}
.strategy-stat{background:#f8fafc;border-radius:7px;padding:5px 2px;text-align:center;font-size:9px}
.strategy-stat b{display:block;font-size:11px}
.notice{padding:9px 11px;border-radius:10px;background:#eff6ff;color:#1e40af;font-size:10px;line-height:1.6}
.state-pill{display:inline-block;border-radius:999px;padding:4px 8px;font-size:10px;font-weight:1000}
.pill-pre{background:#e2e8f0;color:#475569}
.pill-confirmed{background:#dbeafe;color:#1d4ed8}
.pill-settled{background:#dcfce7;color:#166534}
.pill-error{background:#ffedd5;color:#9a3412}
.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:100;height:72px;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-top:1px solid #e5e7eb;display:grid;grid-template-columns:1fr 1fr;padding-bottom:env(safe-area-inset-bottom)}
.nav-btn{border:0;background:none;color:#64748b;font-weight:1000;font-size:12px}
.nav-icon{display:block;font-size:24px;line-height:27px}
.nav-btn.active{color:#2563eb}
.loading{text-align:center;padding:45px 10px;color:#64748b}
.error{background:#fff1f2;color:#be123c;padding:14px;border-radius:12px;line-height:1.6}
@media(max-width:600px){
main{padding:9px 9px 25px}
.race-grid{grid-template-columns:repeat(6,1fr)}
.settlement-grid,.summary-grid{grid-template-columns:repeat(2,1fr)}
.ticket{font-size:17px}
.race-name{font-size:20px}
}
</style>
</head>
<body>
<header class="header">
<div class="header-inner">
<div>
<div class="title">🚴 競輪AI予想</div>
<div class="date" id="headerDate">データ読み込み中…</div>
</div>
<div class="status" id="headerStatus">v6.11</div>
</div>
</header>
<main>
<section id="predictionPage" class="page active">
<div class="card">
<div class="card-title">開催場</div>
<div id="venues" class="venue-scroll"></div>
</div>
<div class="card">
<div class="card-title">
<span id="selectedVenueName">レース</span>
</div>
<div id="raceButtons" class="race-grid"></div>
</div>
<div id="predictionContent">
<div class="loading">データを読み込んでいます…</div>
</div>
</section>
<section id="profitPage" class="page">
<div id="profitContent">
<div class="loading">収支を計算しています…</div>
</div>
</section>
</main>
<nav class="bottom-nav">

🏁
予想
💰
収支
</nav>
<script>
const DATA_URL="./data/today.json";
const BET_YEN_DEFAULT=100;
let DATA=null;
let selectedVenue=null;
let selectedRace=null;
/* =========================
   基本
========================= */
const yen=n=>
Number(n||0).toLocaleString("ja-JP")+"円";
const num=n=>Number(n||0);
const escapeHtml=str=>
String(str??"")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");
function getRaces(){
return Array.isArray(DATA?.races)
?DATA.races
:[];
}
function getPrediction(race){
return race?.frozen_prediction||{};
}
function getBets(race){
const p=getPrediction(race);
if(Array.isArray(p.bets))
return p.bets;
if(Array.isArray(race?.bets))
return race.bets;
return[];
}
function getRanking(race){
const p=getPrediction(race);
if(Array.isArray(p.ranking))
return p.ranking;
if(Array.isArray(race?.ai?.ranking))
return race.ai.ranking;
return[];
}
function getGrade(race){
return String(
race?.frozen_prediction?.verdict?.rank ||
race?.verdict?.rank ||
""
).toUpperCase();
}
function getBetYen(bet){
return num(
bet?.bet_yen ||
BET_YEN_DEFAULT
);
}
/* =========================
   3連単チケット判定
========================= */
function isValidTicket(a){
return Array.isArray(a) &&
a.length===3 &&
a.every(n=>
Number.isInteger(Number(n)) &&
Number(n)>=1 &&
Number(n)<=7
) &&
new Set(a.map(Number)).size===3;
}
function normalizeTicket(value){
const m=String(value??"").match(
/[1-7]\s*[-－ー→>]\s*[1-7]\s*[-－ー→>]\s*[1-7]/
);
if(!m)
return "";
const a=m[0]
.replaceAll("－","-")
.replaceAll("ー","-")
.replaceAll("→","-")
.replaceAll(">","-")
.replace(/\s/g,"")
.split("-")
.map(Number);
return isValidTicket(a)
?a.join("-")
:"";
}
/* =========================
   正しい着順だけ取得
========================= */
function getFinishTicket(race){
const finish=race?.result?.finish;
/* 配列 */
if(Array.isArray(finish) && finish.length>=3){
const a=finish
.slice(0,3)
.map(Number);
if(isValidTicket(a))
return a.join("-");
}
/* 文字列 */
if(typeof finish==="string"){
const ticket=normalizeTicket(finish);
if(ticket)
return ticket;
}
return "";
}
/* =========================
   payout_sourceから3連単を取得
   payout_3tanには3連複が
   入っているケースがあるため
   sourceを優先
========================= */
function parsePayoutSource(source){
const s=String(source||"");
const m=s.match(
/3連単\s*([1-7])\s*[→\-－ー>]\s*([1-7])\s*[→\-－ー>]\s*([1-7])\s*([0-9,]+)円/
);
if(!m)
return null;
const ticket=normalizeTicket(
`${m[1]}-${m[2]}-${m[3]}`
);
if(!ticket)
return null;
return{
ticket:ticket,
yen:Number(
m[4].replace(/,/g,"")
)
};
}
/* =========================
   払戻
========================= */
function getPayoutInfo(race){
const result=race?.result||{};
/* 最優先：payout_source */
const source=
parsePayoutSource(
result.payout_source
);
if(source){
return{
ticket:source.ticket,
yen:source.yen,
available:true,
source:true
};
}
/* 次に明確なpayout_3tan */
const fieldTicket=
normalizeTicket(
result.payout_3tan
);
if(
fieldTicket &&
result.payout_3tan_yen!=null
){
return{
ticket:fieldTicket,
yen:num(result.payout_3tan_yen),
available:true,
source:false
};
}
/* 最後の保険 */
const finishTicket=
getFinishTicket(race);
if(
finishTicket &&
result.payout_available===true &&
num(result.payout_3tan_yen)>0
){
return{
ticket:finishTicket,
yen:num(result.payout_3tan_yen),
available:true,
source:false
};
}
return{
ticket:"",
yen:0,
available:false,
source:false
};
}
/* =========================
   settlement
========================= */
function isSettled(race){
return String(
race?.settlement?.status||""
).toLowerCase()==="settled";
}
/* =========================
   レース状態
========================= */
function getRaceState(race){
const result=race?.result||{};
const finish=
getFinishTicket(race);
/* 収支確定 */
if(isSettled(race))
return "settled";
/* 正常な着順がある */
if(
result.finished===true &&
finish
){
return getPayoutInfo(race).available
?"confirmed"
:"result";
}
/* 払戻だけ先に取れている
   ただし着順がない場合 */
if(
result.payout_available===true &&
!finish
)
return "payout";
/* finished=falseなら
   result_finished=trueでも
   無効な仮結果を表示しない */
if(
result.finished!==true &&
!finish
)
return "pre";
/* finished=trueなのに
   有効着順がない */
if(
result.finished===true &&
!finish
)
return "error";
return "pre";
}
function stateText(race){
switch(getRaceState(race)){
case "settled":
return "✅ 結果・収支確定";
case "confirmed":
return "✅ 結果確定・収支集計待ち";
case "result":
return "🏁 着順確定・払戻待ち";
case "payout":
return "⚠️ 払戻取得済み・着順確認中";
case "error":
return "⚠️ 結果データ確認中";
default:
return "🕐 発走前・結果非表示";
}
}
function stateClass(race){
const state=getRaceState(race);
if(state==="settled")
return "pill-settled";
if(
state==="confirmed" ||
state==="result"
)
return "pill-confirmed";
if(
state==="error" ||
state==="payout"
)
return "pill-error";
return "pill-pre";
}
/* =========================
   オッズ
========================= */
function getBetOdds(race,bet){
/* AI買い目内のオッズを優先 */
const own=bet?.odds;
if(
own!==null &&
own!==undefined &&
Number.isFinite(Number(own)) &&
Number(own)>0
)
return Number(own);
/* race.oddsから補完 */
const map=race?.odds?.odds;
if(
map &&
typeof map==="object" &&
map[bet?.ticket]!=null &&
Number(map[bet.ticket])>0
)
return Number(map[bet.ticket]);
return null;
}
/* =========================
   的中
========================= */
function ticketHit(bet,race){
const result=
getFinishTicket(race);
return !!result &&
String(bet?.ticket)===result;
}
/* =========================
   起動
========================= */
async function loadData(){
try{
const response=
await fetch(
DATA_URL+"?t="+Date.now(),
{
cache:"no-store"
}
);
if(!response.ok)
throw new Error(
"today.jsonを取得できませんでした"
);
DATA=await response.json();
if(
!DATA ||
!Array.isArray(DATA.races)
)
throw new Error(
"today.jsonの形式が正しくありません"
);
document.getElementById(
"headerDate"
).textContent=
`${DATA.target_date||""}　全${DATA.races.length}R`;
document.getElementById(
"headerStatus"
).textContent=
`v${DATA.version||"6.11"}`;
renderVenues();
if(!selectedVenue){
selectedVenue=
DATA.races[0]?.venue_name||"";
}
renderRaceButtons();
const venueRaces=
getRaces().filter(
r=>r.venue_name===selectedVenue
);
if(
!selectedRace ||
!venueRaces.some(
r=>Number(r.race_no)===
Number(selectedRace.race_no)
)
){
selectedRace=
venueRaces[0]||null;
}
renderRace();
renderProfitPage();
}catch(error){
console.error(error);
document.getElementById(
"predictionContent"
).innerHTML=
`<div class="error">
データの読み込みに失敗しました。<br>
${escapeHtml(error.message)}
</div>`;
document.getElementById(
"profitContent"
).innerHTML=
`<div class="error">
収支データを読み込めませんでした。
</div>`;
}
}
/* =========================
   ページ
========================= */
function switchPage(page){
document.getElementById(
"predictionPage"
).classList.toggle(
"active",
page==="prediction"
);
document.getElementById(
"profitPage"
).classList.toggle(
"active",
page==="profit"
);
document.getElementById(
"navPrediction"
).classList.toggle(
"active",
page==="prediction"
);
document.getElementById(
"navProfit"
).classList.toggle(
"active",
page==="profit"
);
window.scrollTo({
top:0,
behavior:"smooth"
});
}
/* =========================
   開催場
========================= */
function renderVenues(){
const venues=[
...new Set(
getRaces().map(
r=>r.venue_name
)
)
];
document.getElementById(
"venues"
).innerHTML=
venues.map(v=>`
<button
class="venue-btn ${v===selectedVenue?"active":""}"
onclick="selectVenue(${JSON.stringify(v)})"
>
${escapeHtml(v)}
</button>
`).join("");
}
function selectVenue(venue){
selectedVenue=venue;
selectedRace=
getRaces().find(
r=>r.venue_name===venue
)||null;
renderVenues();
renderRaceButtons();
renderRace();
}
/* =========================
   レース選択
========================= */
function renderRaceButtons(){
const races=
getRaces()
.filter(
r=>r.venue_name===selectedVenue
)
.sort(
(a,b)=>a.race_no-b.race_no
);
document.getElementById(
"selectedVenueName"
).textContent=
`${selectedVenue||""}　${races.length}R`;
document.getElementById(
"raceButtons"
).innerHTML=
races.map(r=>{
const state=
getRaceState(r);
return`
<button
class="race-btn
${selectedRace?.race_no===r.race_no?"active":""}
${state}"
onclick="selectRace(${r.race_no})"
>
${r.race_no}R
</button>
`;
}).join("");
}
function selectRace(no){
selectedRace=
getRaces().find(
r=>
r.venue_name===selectedVenue &&
Number(r.race_no)===Number(no)
)||null;
renderRaceButtons();
renderRace();
}
/* =========================
   予想画面
========================= */
function renderRace(){
if(!selectedRace){
document.getElementById(
"predictionContent"
).innerHTML=
`<div class="loading">
レースがありません。
</div>`;
return;
}
const race=selectedRace;
const prediction=
getPrediction(race);
const verdict=
prediction.verdict ||
race.verdict ||
{};
const grade=
getGrade(race);
document.getElementById(
"predictionContent"
).innerHTML=`
<div class="card">
<div class="race-head">
<div>
<div class="race-name">
${escapeHtml(race.venue_name)}
${race.race_no}R
</div>
<div class="race-meta">
<span class="state-pill ${stateClass(race)}">
${stateText(race)}
</span>
</div>
</div>
<div class="grade grade-${grade||"C"}">
${grade||"－"}ランク
</div>
</div>
<div class="key-box">
<div class="key-item">
<div class="key-label">本命</div>
<div class="key-num main-num">
${prediction.main??"－"}
</div>
</div>
<div class="key-item">
<div class="key-label">対抗</div>
<div class="key-num opp-num">
${prediction.opponent??"－"}
</div>
</div>
<div class="key-item">
<div class="key-label">穴</div>
<div class="key-num dark-num">
${prediction.dark_horse??"－"}
</div>
</div>
