<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>競輪AI予想</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f3f5f8;
  color: #17202a;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    Meiryo,
    sans-serif;
}

header {
  background: linear-gradient(135deg,#111827,#1f2937);
  color: white;
  padding: 21px 15px;
  position: sticky;
  top: 0;
  z-index: 50;
  box-shadow: 0 3px 12px rgba(0,0,0,.18);
}

.header-inner {
  max-width: 900px;
  margin: auto;
}

.title {
  font-size: 24px;
  font-weight: 900;
}

.subtitle {
  margin-top: 4px;
  font-size: 12px;
  opacity: .75;
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 14px 11px 60px;
}

.section-title {
  font-size: 18px;
  font-weight: 900;
  margin: 12px 2px 9px;
}

/* =========================
   開催場
========================= */

.venue-grid {
  display: grid;
  grid-template-columns: repeat(2,1fr);
  gap: 9px;
}

.venue-card {
  background: white;
  border-radius: 14px;
  padding: 14px;
  border: 2px solid transparent;
  box-shadow: 0 2px 8px rgba(0,0,0,.07);
  cursor: pointer;
}

.venue-card.active {
  border-color: #2563eb;
  background: #eff6ff;
}

.venue-name {
  font-size: 17px;
  font-weight: 900;
}

.venue-count {
  margin-top: 4px;
  font-size: 12px;
  color: #6b7280;
}

/* =========================
   レース
========================= */

.race-list {
  display: grid;
  grid-template-columns: repeat(4,1fr);
  gap: 8px;
}

.race-btn {
  border: 0;
  background: white;
  border-radius: 12px;
  padding: 11px 4px;
  font-weight: 900;
  box-shadow: 0 2px 7px rgba(0,0,0,.07);
  cursor: pointer;
}

.race-btn.active {
  background: #2563eb;
  color: white;
}

.race-number {
  font-size: 17px;
}

.race-info {
  display: block;
  font-size: 10px;
  margin-top: 3px;
  opacity: .7;
}

/* =========================
   レースヘッダー
========================= */

.race-header {
  background: white;
  border-radius: 16px;
  padding: 16px;
  margin-top: 15px;
  box-shadow: 0 2px 9px rgba(0,0,0,.08);
}

.race-title {
  font-size: 23px;
  font-weight: 900;
}

.race-meta {
  margin-top: 4px;
  font-size: 12px;
  color: #6b7280;
}

/* =========================
   AI 3本柱
========================= */

.ai-grid {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 8px;
  margin-top: 11px;
}

.ai-card {
  background: white;
  border-radius: 15px;
  padding: 12px 7px;
  text-align: center;
  box-shadow: 0 2px 8px rgba(0,0,0,.08);
}

.ai-label {
  font-size: 11px;
  font-weight: 900;
  margin-bottom: 6px;
}

.ai-car {
  font-size: 28px;
  font-weight: 900;
}

.ai-name {
  font-size: 12px;
  font-weight: 900;
  margin-top: 4px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.ai-score {
  font-size: 11px;
  color: #6b7280;
  margin-top: 4px;
}

.main-card {
  border-top: 5px solid #dc2626;
}

.opponent-card {
  border-top: 5px solid #2563eb;
}

.dark-card {
  border-top: 5px solid #f97316;
}

/* =========================
   情報カード
========================= */

.info-card {
  background: white;
  border-radius: 16px;
  margin-top: 12px;
  padding: 15px;
  box-shadow: 0 2px 8px rgba(0,0,0,.07);
}

.info-title {
  font-size: 16px;
  font-weight: 900;
  margin-bottom: 11px;
}

/* =========================
   車番色
========================= */

.line-car,
.rider-car {
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 900;
}

.car-1 {
  background: #ffffff;
  color: #111827;
  border: 1px solid #aeb4bc;
}

.car-2 {
  background: #111827;
  color: #ffffff;
}

.car-3 {
  background: #dc2626;
  color: #ffffff;
}

.car-4 {
  background: #2563eb;
  color: #ffffff;
}

.car-5 {
  background: #facc15;
  color: #111827;
}

.car-6 {
  background: #16a34a;
  color: #ffffff;
}

/* ★ 7番は完全オレンジ ★ */

.car-7 {
  background: #f97316;
  color: #ffffff;
}

/* =========================
   並び
========================= */

.line-display {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  align-items: center;
}

.line-group {
  display: flex;
  gap: 4px;
  align-items: center;
  background: #f3f4f6;
  border-radius: 10px;
  padding: 7px 8px;
}

.line-car {
  width: 31px;
  height: 31px;
  border-radius: 7px;
  font-size: 14px;
}

.arrow {
  color: #6b7280;
  font-weight: 900;
}

/* =========================
   AI選手評価
========================= */

.rider {
  border: 1px solid #e5e7eb;
  border-radius: 13px;
  margin-top: 9px;
  padding: 11px;
  background: white;
}

.rider-top {
  display: flex;
  align-items: center;
  gap: 9px;
}

.rider-car {
  width: 37px;
  height: 37px;
  flex: 0 0 37px;
  border-radius: 8px;
  font-size: 17px;
}

/* 車番ごとに文字色を変更 */

.rider-name {
  flex: 1;
  font-size: 15px;
  font-weight: 900;
}

.rider-name.c1,
.ai-ranking-name.c1,
.rider-ai-score.c1 {
  color: #374151;
}

.rider-name.c2,
.ai-ranking-name.c2,
.rider-ai-score.c2 {
  color: #111827;
}

.rider-name.c3,
.ai-ranking-name.c3,
.rider-ai-score.c3 {
  color: #dc2626;
}

.rider-name.c4,
.ai-ranking-name.c4,
.rider-ai-score.c4 {
  color: #2563eb;
}

.rider-name.c5,
.ai-ranking-name.c5,
.rider-ai-score.c5 {
  color: #c58b00;
}

.rider-name.c6,
.ai-ranking-name.c6,
.rider-ai-score.c6 {
  color: #15803d;
}

/* ★ 7番の選手名・AI評価点もオレンジ ★ */

.rider-name.c7,
.ai-ranking-name.c7,
.rider-ai-score.c7 {
  color: #ea580c;
}

.rider-meta {
  margin-top: 5px;
  font-size: 11px;
  color: #6b7280;
}

.rider-comment {
  margin-top: 8px;
  font-size: 13px;
  line-height: 1.55;
  background: #f8fafc;
  border-radius: 8px;
  padding: 8px;
}

.score-box {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 8px;
}

.score {
  background: #f1f5f9;
  padding: 5px 8px;
  border-radius: 7px;
  font-size: 11px;
  font-weight: 700;
}

/* =========================
   展開
========================= */

.development {
  background: #fff7ed;
  border-left: 4px solid #f97316;
  border-radius: 8px;
  padding: 11px;
  font-size: 13px;
  line-height: 1.65;
}

/* =========================
   買い目
========================= */

.bet-summary {
  background: linear-gradient(135deg,#fff7ed,#ffffff);
  border: 2px solid #fed7aa;
}

.bet-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
}

.bet-title {
  font-size: 18px;
  font-weight: 900;
}

.bet-badge {
  background: #f97316;
  color: white;
  border-radius: 999px;
  padding: 5px 10px;
  font-size: 11px;
  font-weight: 900;
}

.bet-explanation {
  margin-top: 8px;
  font-size: 12px;
  line-height: 1.6;
  color: #4b5563;
}

.bet-list {
  margin-top: 11px;
  display: grid;
  gap: 7px;
}

.bet-item {
  display: grid;
  grid-template-columns: 30px 1fr auto;
  align-items: center;
  gap: 8px;
  background: white;
  border: 1px solid #e5e7eb;
  border-radius: 11px;
  padding: 9px;
}

.bet-rank {
  width: 27px;
  height: 27px;
  border-radius: 50%;
  background: #f3f4f6;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 900;
}

.bet-main .bet-rank {
  background: #fee2e2;
  color: #dc2626;
}

.bet-numbers {
  font-size: 18px;
  font-weight: 900;
  letter-spacing: 1px;
}

.bet-type {
  font-size: 10px;
  color: #6b7280;
  margin-top: 2px;
}

.bet-score {
  font-size: 12px;
  font-weight: 900;
  color: #f97316;
}

/* =========================
   AIランキング
========================= */

.ai-ranking {
  display: grid;
  gap: 6px;
}

.ai-ranking-row {
  display: grid;
  grid-template-columns: 28px 32px 1fr 55px 30px;
  align-items: center;
  gap: 6px;
  border-bottom: 1px solid #edf0f3;
  padding: 7px 2px;
}

.ai-rank-number {
  font-weight: 900;
  color: #6b7280;
}

.ai-ranking-car {
  width: 29px;
  height: 29px;
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: 900;
}

.ai-ranking-name {
  font-size: 13px;
  font-weight: 900;
}

.rider-ai-score {
  font-size: 13px;
  font-weight: 900;
  text-align: right;
}

.ai-grade {
  width: 27px;
  height: 27px;
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #f3f4f6;
  font-size: 11px;
  font-weight: 900;
}

/* =========================
   読み込み
========================= */

.loading {
  text-align: center;
  padding: 50px 10px;
  color: #6b7280;
}

.error {
  background: #fee2e2;
  color: #991b1b;
  border-radius: 12px;
  padding: 15px;
  margin-top: 15px;
  line-height: 1.6;
}

.status {
  margin-top: 13px;
  text-align: center;
  font-size: 11px;
  color: #6b7280;
}

/* =========================
   PC
========================= */

@media (min-width:700px) {

  .venue-grid {
    grid-template-columns: repeat(4,1fr);
  }

  .race-list {
    grid-template-columns: repeat(6,1fr);
  }
}

/* =========================
   iPhone
========================= */

@media (max-width:430px) {

  .title {
    font-size: 22px;
  }

  .ai-car {
    font-size: 25px;
  }

  .ai-name {
    font-size: 11px;
  }

  .bet-numbers {
    font-size: 17px;
  }

  .ai-ranking-row {
    grid-template-columns: 25px 30px 1fr 50px 28px;
  }

}

</style>
</head>

<body>

<header>
  <div class="header-inner">

    <div class="title">
      🏇 競輪AI予想
    </div>

    <div class="subtitle">
      今日のレースをAIデータから分析
    </div>

  </div>
</header>

<main class="container">

  <div id="loading" class="loading">
    データを読み込んでいます…
  </div>

  <div id="app" style="display:none;">

    <div class="section-title">
      🏟 開催場
    </div>

    <div id="venues" class="venue-grid"></div>

    <div class="section-title" style="margin-top:18px;">
      🏁 レース
    </div>

    <div id="races" class="race-list"></div>

    <div id="racePanel"></div>

    <div id="status" class="status"></div>

  </div>

  <div id="error" style="display:none;"></div>

</main>

<script>

let DATA = null;
let selectedVenue = null;
let selectedRace = null;

const DATA_URL = "./data/today.json";

/* =========================
   データ読み込み
========================= */

async function loadData() {

  try {

    const response =
      await fetch(DATA_URL + "?t=" + Date.now());

    if (!response.ok) {
      throw new Error(
        "today.jsonを取得できませんでした"
      );
    }

    DATA = await response.json();

    if (!DATA.races || !DATA.races.length) {
      throw new Error(
        "レースデータがありません"
      );
    }

    document.getElementById("loading")
      .style.display = "none";

    document.getElementById("app")
      .style.display = "block";

    renderVenues();

    const firstVenue =
      DATA.venues && DATA.venues.length
      ? DATA.venues[0].venue_code
      : DATA.races[0].venue_code;

    selectVenue(firstVenue);

    document.getElementById("status").textContent =
      `${DATA.target_date || ""} / ` +
      `${DATA.race_count || DATA.races.length}レース / ` +
      `${DATA.rider_count || 0}選手`;

  } catch(error) {

    document.getElementById("loading")
      .style.display = "none";

    const box =
      document.getElementById("error");

    box.style.display = "block";
    box.className = "error";

    box.innerHTML =
      "⚠️ データ読み込み失敗<br><br>" +
      escapeHtml(error.message);

  }
}

/* =========================
   開催場
========================= */

function renderVenues() {

  const container =
    document.getElementById("venues");

  container.innerHTML = "";

  DATA.venues.forEach(venue => {

    const div =
      document.createElement("div");

    div.className = "venue-card";

    div.dataset.code =
      venue.venue_code;

    div.innerHTML = `
      <div class="venue-name">
        ${escapeHtml(venue.venue_name)}
      </div>

      <div class="venue-count">
        ${venue.race_count}レース
      </div>
    `;

    div.onclick =
      () => selectVenue(venue.venue_code);

    container.appendChild(div);

  });
}

function selectVenue(code) {

  selectedVenue = String(code);

  document
    .querySelectorAll(".venue-card")
    .forEach(card => {

      card.classList.toggle(
        "active",
        String(card.dataset.code) ===
        selectedVenue
      );

    });

  const races =
    DATA.races
      .filter(r =>
        String(r.venue_code) === selectedVenue
      )
      .sort((a,b) =>
        a.race_no - b.race_no
      );

  renderRaceButtons(races);

  if (races.length) {
    selectRace(races[0]);
  }
}

/* =========================
   レースボタン
========================= */

function renderRaceButtons(races) {

  const container =
    document.getElementById("races");

  container.innerHTML = "";

  races.forEach(race => {

    const button =
      document.createElement("button");

    button.className = "race-btn";

    button.dataset.race =
      `${race.venue_code}-${race.race_no}`;

    button.innerHTML = `
      <span class="race-number">
        ${race.race_no}R
      </span>

      <span class="race-info">
        ${race.riders.length}車
      </span>
    `;

    button.onclick =
      () => selectRace(race);

    container.appendChild(button);

  });
}

function selectRace(race) {

  selectedRace = race;

  document
    .querySelectorAll(".race-btn")
    .forEach(btn => {

      btn.classList.toggle(
        "active",
        btn.dataset.race ===
        `${race.venue_code}-${race.race_no}`
      );

    });

  renderRace(race);

}

/* =========================
   レース表示
========================= */

function renderRace(race) {

  const panel =
    document.getElementById("racePanel");

  const ai =
    race.ai || {};

  const ranking =
    ai.ranking || [];

  const main =
    findRider(race, ai.main);

  const opponent =
    findRider(race, ai.opponent);

  const dark =
    findRider(race, ai.dark_horse);

  panel.innerHTML = `

    <div class="race-header">

      <div class="race-title">
        ${escapeHtml(race.venue_name)}
        ${race.race_no}R
      </div>

      <div class="race-meta">
        ${race.riders.length}車立て /
        AIデータ取得済み
      </div>

    </div>

    <div class="ai-grid">

      ${renderAICard(
        "🔥 本命",
        main,
        "main-card"
      )}

      ${renderAICard(
        "⭐ 対抗",
        opponent,
        "opponent-card"
      )}

      ${renderAICard(
        "💥 穴",
        dark,
        "dark-card"
      )}

    </div>

    ${renderBets(race)}

    ${renderLine(race)}

    ${renderDevelopment(race)}

    ${renderRanking(race)}

    ${renderRiders(race)}

  `;

}

/* =========================
   AIカード
========================= */

function renderAICard(
  label,
  rider,
  className
) {

  if (!rider) {

    return `
      <div class="ai-card ${className}">
        <div class="ai-label">${label}</div>
        <div class="ai-car">-</div>
        <div class="ai-name">---</div>
      </div>
    `;

  }

  const carClass =
    `c${rider.car_no}`;

  return `
    <div class="ai-card ${className}">

      <div class="ai-label">
        ${label}
      </div>

      <div class="ai-car">
        ${rider.car_no}番
      </div>

      <div class="ai-name ${carClass}">
        ${escapeHtml(rider.name)}
      </div>

      <div class="ai-score">
        AI ${formatScore(rider.ai_score)}点
      </div>

    </div>
  `;
}

/* =========================
   ★ 買い目10点生成
========================= */

function generateBets(race) {

  const riders =
    [...race.riders]
      .sort(
        (a,b) =>
          (b.ai_score || 0) -
          (a.ai_score || 0)
      );

  if (riders.length < 3) {
    return [];
  }

  const main =
    riders[0];

  const second =
    riders[1];

  const third =
    riders[2];

  const fourth =
    riders[3];

  const fifth =
    riders[4];

  const dark =
    findRider(
      race,
      race.ai && race.ai.dark_horse
    ) || third;

  const line =
    race.line || [];

  const groups =
    race.line_groups || [];

  const candidates = [];

  function add(
    a,b,c,
    type,
    score
  ) {

    if (!a || !b || !c) return;

    const nums =
      [a.car_no,b.car_no,c.car_no];

    if (
      nums[0] === nums[1] ||
      nums[0] === nums[2] ||
      nums[1] === nums[2]
    ) {
      return;
    }

    const key =
      nums.join("-");

    if (
      candidates.some(
        x => x.key === key
      )
    ) {
      return;
    }

    candidates.push({
      key,
      nums,
      type,
      score
    });

  }

  /* 本線 */

  add(
    main,
    second,
    third,
    "AI本線",
    100
  );

  add(
    main,
    third,
    second,
    "本命→穴目",
    97
  );

  add(
    second,
    main,
    third,
    "対抗頭",
    94
  );

  add(
    main,
    second,
    dark,
    "本命→穴",
    92
  );

  add(
    main,
    dark,
    second,
    "穴絡み",
    90
  );

  /* ライン展開 */

  if (groups.length) {

    groups.forEach(group => {

      if (group.length >= 2) {

        const a =
          findRider(
            race,
            group[0]
          );

        const b =
          findRider(
            race,
            group[1]
          );

        if (a && b) {

          add(
            a,
            b,
            main.car_no === a.car_no
              ? third
              : main,
            "ライン本線",
            88
          );

          add(
            b,
            a,
            main,
            "番手差し",
            85
          );

        }

      }

    });

  }

  /* AI上位の入れ替わり */

  add(
    third,
    main,
    second,
    "逆転",
    82
  );

  add(
    second,
    third,
    main,
    "対抗展開",
    80
  );

  if (fourth) {

    add(
      main,
      fourth,
      second,
      "中穴",
      76
    );

    add(
      fourth,
      main,
      third,
      "高配当狙い",
      72
    );

  }

  if (fifth) {

    add(
      main,
      dark,
      fifth,
      "大穴警戒",
      68
    );

  }

  /* ラインにいる選手を少し優先 */

  candidates.forEach(bet => {

    const inLine =
      bet.nums.filter(
        n => line.includes(n)
      ).length;

    bet.score +=
      inLine * 2;

  });

  candidates.sort(
    (a,b) => b.score - a.score
  );

  return candidates.slice(0,10);
}

/* =========================
   買い目表示
========================= */

function renderBets(race) {

  const bets =
    generateBets(race);

  if (!bets.length) {
    return "";
  }

  return `

    <div class="info-card bet-summary">

      <div class="bet-header">

        <div class="bet-title">
          🎯 AI推奨買い目
        </div>

        <div class="bet-badge">
          最大10点
        </div>

      </div>

      <div class="bet-explanation">
        AI評価・予想ライン・展開情報を組み合わせ、
        本線から展開違いまで10点以内に絞っています。
      </div>

      <div class="bet-list">

        ${bets.map((bet,index) => `

          <div class="bet-item
            ${index === 0 ? "bet-main" : ""}">

            <div class="bet-rank">
              ${index + 1}
            </div>

            <div>

              <div class="bet-numbers">
                ${bet.nums.join(" - ")}
              </div>

              <div class="bet-type">
                ${escapeHtml(bet.type)}
              </div>

            </div>

            <div class="bet-score">
              ${bet.score}
            </div>

          </div>

        `).join("")}

      </div>

    </div>

  `;
}

/* =========================
   並び
========================= */

function renderLine(race) {

  const groups =
    race.line_groups || [];

  let content = "";

  if (groups.length) {

    content =
      groups.map(group => {

        return `
          <div class="line-group">

            ${group.map(
              (car,index) => `

              ${
                index > 0
                ? `<span class="arrow">→</span>`
                : ""
              }

              <div class="
                line-car car-${car}">
                ${car}
              </div>

            `
            ).join("")}

          </div>
        `;

      }).join("");

  } else if (
    race.line &&
    race.line.length
  ) {

    content = `
      <div class="line-group">

        ${race.line.map(
          (car,index) => `

          ${
            index > 0
            ? `<span class="arrow">→</span>`
            : ""
          }

          <div class="line-car car-${car}">
            ${car}
          </div>

        `
        ).join("")}

      </div>
    `;

  } else {

    content =
      "並び情報なし";

  }

  return `

    <div class="info-card">

      <div class="info-title">
        🚴 予想ライン
      </div>

      <div class="line-display">
        ${content}
      </div>

    </div>

  `;
}

/* =========================
   展開
========================= */

function renderDevelopment(race) {

  if (!race.development) {
    return "";
  }

  return `

    <div class="info-card">

      <div class="info-title">
        🧠 展開予想
      </div>

      <div class="development">
        ${escapeHtml(
          race.development
        )}
      </div>

    </div>

  `;
}

/* =========================
   AIランキング
========================= */

function renderRanking(race) {

  const ranking =
    [...(race.ai?.ranking || [])];

  if (!ranking.length) {
    return "";
  }

  return `

    <div class="info-card">

      <div class="info-title">
        📊 AI評価ランキング
      </div>

      <div class="ai-ranking">

        ${ranking.map(
          (r,index) => {

            const carClass =
              `c${r.car_no}`;

            const grade =
              index === 0
              ? "S"
              : index === 1
              ? "A"
              : index === 2
              ? "B"
              : "C";

            return `

              <div class="ai-ranking-row">

                <div class="ai-rank-number">
                  ${index + 1}
                </div>

                <div class="
                  ai-ranking-car car-${r.car_no}">
                  ${r.car_no}
                </div>

                <div class="
                  ai-ranking-name ${carClass}">
                  ${escapeHtml(r.name)}
                </div>

                <div class="
                  rider-ai-score ${carClass}">
                  ${formatScore(r.score)}
                </div>

                <div class="ai-grade">
                  ${grade}
                </div>

              </div>

            `;

          }
        ).join("")}

      </div>

    </div>

  `;
}

/* =========================
   選手評価
========================= */

function renderRiders(race) {

  const riders =
    [...race.riders]
      .sort(
        (a,b) =>
          (b.ai_score || 0) -
          (a.ai_score || 0)
      );

  return `

    <div class="info-card">

      <div class="info-title">
        👤 AI選手評価
      </div>

      ${riders.map(
        (rider,index) =>
          renderRider(
            rider,
            index
          )
      ).join("")}

    </div>

  `;
}

function renderRider(
  rider,
  index
) {

  let mark =
    rider.prediction_mark || "";

  if (!mark) {

    if (index === 0) {
      mark = "◎";
    } else if (index === 1) {
      mark = "○";
    } else if (index === 2) {
      mark = "▲";
    } else {
      mark = "△";
    }

  }

  const carClass =
    `c${rider.car_no}`;

  const finish =
    [
      rider.finish_1,
      rider.finish_2,
      rider.finish_3,
      rider.finish_out
    ]
    .filter(
      v =>
        v !== null &&
        v !== undefined
    )
    .join("-");

  return `

    <div class="rider">

      <div class="rider-top">

        <div class="
          rider-car car-${rider.car_no}">
          ${rider.car_no}
        </div>

        <div class="
          rider-name ${carClass}">
          ${escapeHtml(rider.name)}
        </div>

        <div class="mark">
          ${escapeHtml(mark)}
        </div>

      </div>

      <div class="rider-meta">

        ${
          rider.age
          ? rider.age + "歳"
          : ""
        }

        ${
          rider.period
          ? " / " + rider.period + "期"
          : ""
        }

        ${
          rider.prefecture
          ? " / " +
            escapeHtml(
              rider.prefecture
            )
          : ""
        }

        ${
          rider.grade
          ? " / " +
            escapeHtml(
              rider.grade
            )
          : ""
        }

        ${
          rider.style
          ? " / " +
            escapeHtml(
              rider.style
            )
          : ""
        }

      </div>

      <div class="score-box">

        <span class="score">
          AI
          <strong class="${carClass}">
            ${formatScore(
              rider.ai_score
            )}
          </strong>
        </span>

        ${
          rider.score != null
          ? `
            <span class="score">
              競走得点
              ${rider.score}
            </span>
          `
          : ""
        }

        ${
          finish
          ? `
            <span class="score">
              着順 ${finish}
            </span>
          `
          : ""
        }

      </div>

      ${
        rider.comment
        ? `
          <div class="rider-comment">
            💬
            ${escapeHtml(
              rider.comment
            )}
          </div>
        `
        : ""
      }

    </div>

  `;
}

/* =========================
   共通
========================= */

function findRider(
  race,
  carNo
) {

  if (
    carNo === null ||
    carNo === undefined
  ) {
    return null;
  }

  return race.riders.find(
    r =>
      Number(r.car_no) ===
      Number(carNo)
  ) || null;
}

function formatScore(value) {

  if (
    value === null ||
    value === undefined ||
    isNaN(value)
  ) {
    return "-";
  }

  return Number(value).toFixed(1);
}

function escapeHtml(value) {

  if (
    value === null ||
    value === undefined
  ) {
    return "";
  }

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

loadData();

</script>
