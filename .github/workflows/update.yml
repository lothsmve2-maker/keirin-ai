name: Update Keirin Data

on:
  schedule:
    - cron: "0,30 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Update data
        run: |
          python scripts/update.py

      - name: Commit updated data
        run: |
          git config --global user.name "keirin-ai"
          git config --global user.email "keirin-ai@users.noreply.github.com"

          git add data/today.json

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update keirin data"
            git push
          fi
